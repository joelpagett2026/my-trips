<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip · Itinerary</title>
<link rel="icon" href="/icons/trips-favicon.ico">
<link rel="apple-touch-icon" href="/icons/trips-apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/itinerary-v2-style.css?v=49">
<script src="/auth.js" defer></script>
<script src="/db.js" defer></script>
</head>
<body>

<!-- ══ SIDEBAR ══════════════════════════════════════════════════ -->
<aside class="v2-sidebar">
  <div class="sb-trip">
    <div class="sb-flag" id="sb-flag">🌍</div>
    <div class="sb-name" id="sb-name">Loading…</div>
    <div class="sb-meta" id="sb-meta"></div>
  </div>
  <nav class="sb-nav">
    <button class="sb-btn active" id="sb-btn-itinerary" onclick="setView('itinerary')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Itinerary
    </button>
    <div class="sb-section-label">Days</div>
    <div id="sb-days"></div>
    <div class="sb-divider"></div>
    <button class="sb-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      Bookings
    </button>
    <button class="sb-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/></svg>
      Map
    </button>
    <button class="sb-btn" id="sb-btn-budget" onclick="setView('budget')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Budget
    </button>
  </nav>
  <div class="sb-bottom">
    <button class="sb-btn" onclick="location.href='/settings.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      Settings
    </button>
    <button class="sb-btn" onclick="location.href='/trips/'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      All trips
    </button>
  </div>
</aside>

<!-- ══ MAIN ══════════════════════════════════════════════════════ -->
<div class="v2-main">

  <!-- TOP BAR -->
  <div class="v2-topbar">
    <div class="tb-left">
      <div class="tb-kicker" id="tb-kicker">Loading…</div>
      <div class="tb-title" id="tb-title"></div>
    </div>
    <div class="tb-right">
      <span class="tb-status" id="tb-status"></span>
      <div class="mode-toggle" id="tb-mode">
        <button class="mode-btn active" id="mode-plan" onclick="setMode('plan')">Plan</button>
        <button class="mode-btn" id="mode-today" onclick="setMode('today')">Today</button>
      </div>
      <button class="tb-btn" id="tb-add-day" onclick="openAddDay()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add day
      </button>
      <button class="tb-btn" id="tb-share" onclick="triggerShare()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
        Share
      </button>
    </div>
  </div>

  <!-- DAY SELECTOR -->
  <div class="day-selector" id="day-selector"></div>

  <!-- DAY SUMMARY -->

  <!-- CONTENT -->
  <div class="v2-content" id="view-itinerary">
    <!-- TIMELINE -->
    <div class="tl-col" id="tl-col"></div>

    <!-- RIGHT PANEL -->
    <div class="rp-col">
      <div class="rp-section">
        <div class="rp-h" style="display:flex;align-items:center;">
          Accommodation
          <button onclick="openHotelModal()" style="margin-left:auto;background:none;border:none;color:var(--teal);font-family:var(--font);font-size:10px;font-weight:700;cursor:pointer;padding:0;letter-spacing:0.03em;">+ Add / Edit</button>
        </div>
        <div id="rp-hotel">—</div>
      </div>
      <div class="rp-section">
        <div class="rp-h">Trip Readiness</div>
        <div id="rp-readiness"></div>
      </div>
      <div class="rp-section">
        <div class="rp-h">Estimated Spend</div>
        <div id="rp-budget"></div>
      </div>
      <div class="rp-section">
        <div class="rp-h">Key Bookings</div>
        <div id="rp-bookings"></div>
      </div>
    </div>
  </div><!-- /view-itinerary -->

  <!-- BUDGET VIEW -->
  <div class="v2-content" id="view-budget" style="display:none;overflow-y:auto;">
    <div id="budget-main" style="flex:1;overflow-y:auto;padding:24px 24px 48px;min-width:0;width:100%;"></div>
  </div>

</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dr-head">
    <div class="dr-head-text">
      <div class="dr-kicker" id="dr-kicker"></div>
      <div class="dr-title" id="dr-title"></div>
      <div class="dr-sub" id="dr-sub"></div>
    </div>
    <button class="dr-close" onclick="closeDrawer()">×</button>
  </div>
  <div class="dr-body">
    <div id="dr-status-row" style="margin-bottom:12px;"></div>
    <div class="dr-actions">
      <button class="dr-act-btn" onclick="editCurrentItem()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit
      </button>
      <button class="dr-act-btn" onclick="deleteCurrentItem()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        Delete
      </button>
      <button class="dr-act-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Directions
      </button>
      <button class="dr-act-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        More
      </button>
    </div>
    <div id="dr-booking-body"></div>
    <button class="dr-primary-btn" id="dr-open-btn" style="display:none">Open booking →</button>

    <!-- ABOUT THIS PLACE -->
    <div id="dr-about-wrap" style="display:none; margin-top:16px;">
      <div class="dr-about-header">📖 About this place</div>
      <div id="dr-about-body"></div>
    </div>
    <div id="dr-about-loading" style="display:none; margin-top:16px; text-align:center; padding:20px 0;">
      <div class="dr-about-spinner"></div>
      <div style="font-size:11px; color:var(--text3); margin-top:8px;">Generating visitor info…</div>
    </div>
    <button id="dr-about-retry" style="display:none; margin-top:12px; width:100%; background:none; border:1px solid var(--line); color:var(--text2); font-family:var(--font); font-size:11px; font-weight:700; padding:8px; border-radius:8px; cursor:pointer;" onclick="generateAbout(true)">
      ↻ Generate visitor info
    </button>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">Add activity</div>
      <div class="modal-tabs" id="modal-tabs">
        <button class="modal-tab active" id="tab-single" onclick="setModalTab('single')">Single</button>
        <button class="modal-tab" id="tab-bulk" onclick="setModalTab('bulk')">Bulk import</button>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <!-- BULK IMPORT PANEL -->
    <div class="modal-body" id="modal-body-bulk" style="display:none;">
      <div class="field-group">
        <label class="field-label">Part of day</label>
        <select class="field-select" id="f-bulk-period">
          <option value="morning">Morning</option>
          <option value="afternoon">Afternoon</option>
          <option value="evening">Evening</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Activities — one per line</label>
        <textarea class="field-textarea" id="f-bulk-list" rows="10"
          placeholder="São Bento Station&#10;Porto Cathedral&#10;Dom Luís I Bridge&#10;Lunch — Nata Lisboa"></textarea>
        <div style="font-size:10.5px;color:var(--text3);margin-top:5px;">Each line becomes a separate activity. Blank lines are skipped.</div>
      </div>
      <div class="field-group">
        <label class="field-label">Category for all items</label>
        <select class="field-select" id="f-bulk-type">
          <option value="act">Activity / Place</option>
          <option value="meal">Meal</option>
          <option value="move">Transport / Walk</option>
        </select>
      </div>
    </div>
    <div class="modal-body" id="modal-body-single">
      <!-- Category first, always visible -->
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Category</label>
          <select class="field-select" id="f-type" onchange="onCategoryChange()">
            <option value="act">Activity / Place</option>
            <option value="meal">Meal</option>
            <option value="move">Transport</option>
            <option value="hotel">Accommodation</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Part of day</label>
          <select class="field-select" id="f-period">
            <option value="morning">Morning</option>
            <option value="afternoon">Afternoon</option>
            <option value="evening">Evening</option>
          </select>
        </div>
      </div>

      <!-- STANDARD FIELDS (activity / meal / hotel) -->
      <div id="fields-standard">
        <div class="field-group">
          <label class="field-label">Title</label>
          <input class="field-input" id="f-title" type="text" placeholder="e.g. Teleférico de Gaia">
        </div>
        <div class="field-group">
          <label class="field-label">Subtitle / location</label>
          <input class="field-input" id="f-sub" type="text" placeholder="e.g. Gaia Cable Car">
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Time (optional)</label>
            <input class="field-input" id="f-time" type="time">
          </div>
          <div class="field-group">
            <label class="field-label">Status</label>
            <select class="field-select" id="f-status">
              <option value="">—</option>
              <option value="booked">✓ Booked</option>
              <option value="confirmed">✓ Confirmed</option>
              <option value="walkin">Walk in only</option>
              <option value="attention">Needs attention</option>
            </select>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Travel time from previous (optional)</label>
          <input class="field-input" id="f-conn" type="text" placeholder="e.g. 10 min walk">
        </div>
      </div>

      <!-- TRANSPORT FIELDS -->
      <div id="fields-transport" style="display:none;flex-direction:column;gap:13px;">
        <div class="field-group">
          <label class="field-label">Type of transport</label>
          <div class="transport-type-row" id="f-transport-type-row">
            <button type="button" class="tt-btn active" data-val="Flight">Flight</button>
            <button type="button" class="tt-btn" data-val="Train">Train</button>
            <button type="button" class="tt-btn" data-val="Coach">Coach</button>
            <button type="button" class="tt-btn" data-val="Bus">Bus</button>
            <button type="button" class="tt-btn" data-val="Ferry">Ferry</button>
            <button type="button" class="tt-btn" data-val="Other">Other</button>
          </div>
          <input class="field-input" id="f-transport-type" type="hidden" value="Flight">
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Departure</label>
            <input class="field-input" id="f-from" type="text" placeholder="e.g. London Gatwick">
          </div>
          <div class="field-group">
            <label class="field-label">Departure time</label>
            <input class="field-input" id="f-depart" type="time">
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Arrival</label>
            <input class="field-input" id="f-to" type="text" placeholder="e.g. Porto">
          </div>
          <div class="field-group">
            <label class="field-label">Arrival time</label>
            <input class="field-input" id="f-arrive" type="time">
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Status</label>
          <select class="field-select" id="f-status-move">
            <option value="">—</option>
            <option value="booked">✓ Booked</option>
            <option value="confirmed">✓ Confirmed</option>
            <option value="attention">Needs attention</option>
          </select>
        </div>
      </div>

      <!-- Booking details toggle -->
      <button class="booking-toggle" id="booking-toggle-btn" onclick="toggleBooking()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg>
        Add booking details
      </button>
      <div class="booking-fields" id="booking-fields" style="display:none;">
        <div class="field-group">
          <label class="field-label">Booking reference</label>
          <input class="field-input" id="f-ref" type="text" placeholder="e.g. ZTQNBT">
        </div>
        <div class="field-group">
          <label class="field-label">Price</label>
          <input class="field-input" id="f-price" type="text" placeholder="e.g. £40 pp">
        </div>
        <div class="field-group">
          <label class="field-label">Tickets / quantity</label>
          <input class="field-input" id="f-tickets" type="text" placeholder="e.g. 2 tickets">
        </div>
        <div class="field-group">
          <label class="field-label">Booking URL</label>
          <input class="field-input" id="f-url" type="url" placeholder="https://…">
        </div>
        <div class="field-group">
          <label class="field-label">Notes</label>
          <textarea class="field-textarea" id="f-note" placeholder="Any extra details…"></textarea>
        </div>
      </div>
    </div>
    </div><!-- /modal-body-single -->
    <div class="modal-foot">
      <button class="modal-btn danger" id="modal-delete-btn" style="display:none" onclick="deleteCurrentItem()">Delete</button>
      <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" id="modal-save-btn" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!-- HOTEL MODAL -->
<div class="modal-overlay" id="hotel-modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="hotel-modal-title">Add accommodation</div>
      <button class="modal-close" onclick="closeHotelModal()">×</button>
    </div>
    <div class="modal-body" style="flex-direction:column;gap:13px;">
      <div class="field-group">
        <label class="field-label">Hotel name</label>
        <input class="field-input" id="hf-name" type="text" placeholder="e.g. Fontinha Porto">
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Check in</label>
          <input class="field-input" id="hf-checkin" type="text" placeholder="dd/mm/yyyy">
        </div>
        <div class="field-group">
          <label class="field-label">Check out</label>
          <input class="field-input" id="hf-checkout" type="text" placeholder="dd/mm/yyyy">
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Rate / night</label>
          <input class="field-input" id="hf-nightly" type="text" placeholder="e.g. £77.50">
        </div>
        <div class="field-group">
          <label class="field-label">Breakfast</label>
          <select class="field-select" id="hf-breakfast">
            <option value="not_included">Not included</option>
            <option value="included">Included</option>
          </select>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Booking reference</label>
        <input class="field-input" id="hf-ref" type="text" placeholder="e.g. 90900EE04320">
      </div>
      <div class="field-group">
        <label class="field-label">Photo</label>
        <label class="hotel-upload-label" id="hotel-upload-label" for="hf-photo-file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="hotel-upload-label-text">Upload photo</span>
        </label>
        <input type="file" id="hf-photo-file" accept="image/*" style="display:none;" onchange="onHotelPhotoSelected(this)">
      </div>
      <div id="hotel-photo-preview" style="display:none;">
        <img id="hotel-photo-img" src="" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">
        <div style="font-size:10px;color:var(--text3);margin-top:5px;display:flex;align-items:center;gap:8px;">
          <span id="hotel-photo-size"></span>
          <button onclick="clearHotelPhoto()" style="background:none;border:none;color:var(--amber);font-size:10px;cursor:pointer;font-family:inherit;padding:0;margin-left:auto;">✕ Remove</button>
        </div>
      </div>
      <div id="hotel-photo-status" style="font-size:10.5px;color:var(--text3);display:none;"></div>
    </div>
    <div class="modal-foot">
      <button class="modal-btn danger" id="hotel-delete-btn" style="display:none" onclick="deleteHotel()">Delete</button>
      <button class="modal-btn secondary" onclick="closeHotelModal()">Cancel</button>
      <button class="modal-btn primary" onclick="saveHotel()">Save</button>
    </div>
  </div>
</div>

<!-- MOBILE BOTTOM NAV (hidden on desktop via CSS) -->
<div class="mob-nav" id="mob-nav">
  <div class="mob-nav-days" id="mob-nav-days"></div>
  <button class="mob-nav-add" onclick="openAddItem()" title="Add activity">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>

<!-- SNAPSHOT BAR -->
<div class="snapshot-bar" id="snapshot-bar">
  <span id="snapshot-msg">Snapshot saved</span>
  <button onclick="restoreSnapshot()">Undo</button>
</div>

<script>
// ── BAKE POINT (deploy webhook replaces this block) ──────────────────
// Read URL params
const params = new URLSearchParams(window.location.search);
const dest   = params.get('dest') || 'New Trip';
const dep    = params.get('dep')  || '';
const ret    = params.get('ret')  || '';
const trav   = params.get('trav') || '2';
const status = params.get('status') || 'upcoming';
const slug   = params.get('slug') || 'new-trip';

// Use slug as the database record ID
const RECORD_ID = slug;
const budgetPageUrl = '/' + slug.split('-')[0] + '-budget.html';
// ────────────────────────────────────────────────────────────────────

// ── STATE ────────────────────────────────────────────────────────────
const AUTH_TOKEN = '06843e3f58776ec2eb5e0cc7a44a3c3fc1b4b9af2e75504da3d299dc566cc395';
let STATE = { days: [], meta: { dest, dep, ret, trav, status, hotel: null, budget: null } };
let activeDay = 0;
let currentMode = 'plan';
let drawerItem = null;  // { dayIdx, item } — object ref
let editItem   = null;  // same, or null for new
let snapshotData = null;
let saveTimer = null;

// ── ICONS ────────────────────────────────────────────────────────────
const ICO = {

const TRANSPORT_ICONS = {
  Flight: ICO.plane,
  Train:  ICO.train,
  Bus:    ICO.bus,
  Coach:  ICO.coach,
  Ferry:  ICO.ferry,
  Other:  ICO.walk,
};

function icoForType(t, sub, item) {
  if (t==='meal') {
    const s = ((item && item.title)||sub||'').toLowerCase();
    if (s.includes('breakfast')||s.includes('coffee')||s.includes('café')||s.includes('caffe')) return {html:ICO.coffee, cls:'meal'};
    if (s.includes('dinner')) return {html:ICO.dinner, cls:'meal'};
    return {html:ICO.utensils, cls:'meal'};
  }
  if (t==='move') {
    const mode = (item && item.transport && item.transport.mode) || (item && item.kicker) || 'Flight';
    return {html: TRANSPORT_ICONS[mode] || ICO.plane, cls:'move'};
  }
  if (t==='hotel') return {html:ICO.home, cls:''};
  return {html:ICO.pin, cls:''};
}

function badgeHtml(status, label) {
  if (!status) return '';
  const icons = { booked: ICO.check, confirmed: ICO.check, attention: ICO.warn };
  const ic = icons[status] ? `<span style="display:inline-flex;width:9px;height:9px;align-items:center;">${icons[status]}</span>` : '';
  const txt = label || { booked:'Booked', confirmed:'Confirmed', walkin:'Walk in only', attention:'Needs attention' }[status] || status;
  return `<span class="badge ${status}">${ic}${txt}</span>`;
}

// ── FLAG HELPER ───────────────────────────────────────────────────────
function flagFor(d) {
  const map = { 'Porto':'🇵🇹','Porto 2026':'🇵🇹','Hamburg':'🇩🇪','Gothenburg':'🇸🇪','Cyprus':'🇨🇾','China':'🇨🇳','Dubai':'🇦🇪','Costa Rica':'🇨🇷','Canada':'🇨🇦','Hong Kong':'🇭🇰','Taiwan':'🇹🇼' };
  for (const [k,v] of Object.entries(map)) { if (d.toLowerCase().includes(k.toLowerCase())) return v; }
  return '🌍';
}

// ── LOAD / SAVE ───────────────────────────────────────────────────────
async function loadData() {
  try {
    const saved = await dbLoad(RECORD_ID);
    if (saved && saved.days) {
      STATE = saved;
      STATE.meta = STATE.meta || { dest, dep, ret, trav, status, hotel:null, budget:null };
    } else {
      // New trip — seed with one empty day
      STATE.days = [{ date: dep, loc: dest, title: 'Day 1', items: [] }];
      STATE.meta = { dest, dep, ret, trav, status, hotel:null, budget:null };
    }
  } catch(e) {
    console.error('Load failed', e);
    const msg = e && e.message ? e.message : String(e);
    document.getElementById('tb-kicker').textContent = msg.includes('token') || msg.includes('auth') 
      ? 'Session expired — re-enter PIN' : 'Load error: ' + msg.slice(0,40);
    // If token issue, trigger PIN overlay by calling auth.js clearSession + reload
    if (msg.includes('token') || msg.includes('auth') || !msg) {
      if (typeof clearSession === 'function') clearSession();
      setTimeout(() => location.reload(), 500);
    }
    return;
  }
  render();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 1800);
  setStatus('saving', '●  Saving…');
}

async function saveData() {
  // Take a snapshot before every save
  takeSnapshot();
  try {
    await dbSave(RECORD_ID, STATE);
    setStatus('saved', '');
  } catch(e) {
    setStatus('error', '✕ Save failed');
  }
}

function setStatus(cls, txt) {
  const el = document.getElementById('tb-status');
  el.textContent = txt;
  el.className = 'tb-status ' + (cls||'');
}

// ── SNAPSHOTS ─────────────────────────────────────────────────────────
// Keeps the last 10 saves as a separate DB record (id = RECORD_ID + '-snaps')
// so a delete or accidental wipe is recoverable after a refresh.
const SNAPS_ID = RECORD_ID + '-snaps';
let snapshotList = [];

async function loadSnapshots() {
  try {
    const d = await dbLoad(SNAPS_ID);
    snapshotList = (d && d.snaps) ? d.snaps : [];
  } catch {}
}

function takeSnapshot() {
  const entry = { ts: Date.now(), data: JSON.parse(JSON.stringify(STATE)) };
  snapshotList.unshift(entry);
  if (snapshotList.length > 10) snapshotList.length = 10;
  dbSave(SNAPS_ID, { snaps: snapshotList }).catch(() => {});
}

async function restoreSnapshot() {
  if (!snapshotList.length) return;
  const prev = snapshotList[0];
  if (!prev) return;
  STATE = prev.data;
  render();
  scheduleSave();
  showSnapshotBar(false);
}

function showSnapshotBar(show) {
  document.getElementById('snapshot-bar').classList.toggle('show', show);
}

// Infer a period from an item that has no explicit period set
function inferPeriod(item) {
  const k = (item.kicker||'').toLowerCase();
  const t = item.time || '';
  if (k==='morning' || k==='breakfast') return 'morning';
  if (k==='afternoon') return 'afternoon';
  if (k==='evening' || k==='dinner') return 'evening';
  if (t) {
    const h = parseInt(t.split(':')[0]);
    if (!isNaN(h)) {
      if (h < 12) return 'morning';
      if (h < 17) return 'afternoon';
      return 'evening';
    }
  }
  return 'morning';
}

const PERIODS = [
  { key:'morning',   label:'Morning'   },
  { key:'afternoon', label:'Afternoon' },
  { key:'evening',   label:'Evening'   },
];

function renderTimeline() {
  const d = STATE.days[activeDay];
  const col = document.getElementById('tl-col');
  if (!d) { col.innerHTML = ''; return; }

  col.innerHTML = '';

  // Staying pill
  const hotelItem = (d.items||[]).find(it => it && it.type==='hotel' && it.staying);
  if (hotelItem) {
    const pill = document.createElement('div');
    pill.className = 'staying-pill';
    pill.innerHTML = ICO.home.replace('<svg','<svg width="12" height="12"') + ' Staying at <span>' + hotelItem.staying + '</span>';
    col.appendChild(pill);
  }

  const allItems = d.items || [];

  // Bucket items into periods (fall back to inferPeriod for legacy items)
  const buckets = { morning:[], afternoon:[], evening:[] };
  allItems.forEach((item, globalIdx) => {
    if (!item) return;
    const p = item.period || inferPeriod(item);
    buckets[p].push({ item, globalIdx });
  });

  const hiddenPeriods = d._hiddenPeriods || [];
  PERIODS.forEach(({ key, label }) => {
    if (hiddenPeriods.includes(key)) return;
    const section = document.createElement('div');
    section.className = 'tl-section';
    section.dataset.period = key;

    // Section header
    const hdr = document.createElement('div');
    hdr.className = 'tl-section-hdr';
    hdr.innerHTML =
      '<div class="tl-section-accent ' + key + '"></div>' +
      '<span class="tl-section-label">' + label + '</span>' +
      '<span class="tl-section-count" id="tl-count-' + key + '">' +
        buckets[key].length + ' item' + (buckets[key].length !== 1 ? 's' : '') +
      '</span>' +
      '<button class="tl-section-clear" data-clear-period="' + key + '" title="Remove all ' + label.toLowerCase() + ' items">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
      '</button>';
    section.appendChild(hdr);

    // Timeline list for this period
    const tl = document.createElement('div');
    tl.className = 'timeline';
    tl.id = 'tl-' + key;
    tl.dataset.period = key;

    buckets[key].forEach(({ item, globalIdx }) => {
      tl.appendChild(makeItemNode(item, globalIdx));
    });

    section.appendChild(tl);

    // Per-section add button
    const addBtn = document.createElement('button');
    addBtn.className = 'tl-add-btn';
    addBtn.innerHTML = ICO.plus.replace('<svg','<svg width="14" height="14"') + ' Add to ' + label.toLowerCase();
    addBtn.onclick = () => openAddItem(key);
    section.appendChild(addBtn);

    col.appendChild(section);
    initDrag(tl);
  });

  // Restore strip for any hidden periods
  if (hiddenPeriods.length) {
    const strip = document.createElement('div');
    strip.className = 'tl-restore-strip';
    hiddenPeriods.forEach(key => {
      const label = PERIODS.find(p => p.key === key)?.label || key;
      const btn = document.createElement('button');
      btn.className = 'tl-restore-btn';
      btn.textContent = '+ ' + label;
      btn.onclick = () => unhidePeriod(key);
      strip.appendChild(btn);
    });
    col.appendChild(strip);
  }
}

// ── DRAG-TO-REORDER ──────────────────────────────────────────────────
// Window-level listeners avoid the setPointerCapture + insertBefore bug.
// 6px threshold distinguishes tap (opens drawer) from drag (reorders).
let dragEl = null, dragGhost = null, dragOver = null;
let dragStartX = 0, dragStartY = 0, dragMoved = false;

function initDrag(tl) {
  tl.addEventListener('pointerdown', onDragStart);
}

function onDragStart(e) {
  const grip = e.target.closest('.tl-grip, .tl-time');
  if (!grip) return;
  const item = e.target.closest('.tl-item');
  if (!item) return;
  dragEl = item;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragMoved  = false;
  window.addEventListener('pointermove',   onDragMove);
  window.addEventListener('pointerup',     onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e) {
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (!dragMoved) {
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    dragMoved = true;
    startDragVisual();
  }
  dragGhost.style.top  = (dragGhost._baseTop  + dy) + 'px';
  dragGhost.style.left = (dragGhost._baseLeft + dx) + 'px';
  updateDropTarget(e.clientY);
}

function startDragVisual() {
  const rect = dragEl.getBoundingClientRect();
  dragGhost = dragEl.cloneNode(true);
  Object.assign(dragGhost.style, {
    position:'fixed', width:rect.width+'px', top:rect.top+'px', left:rect.left+'px',
    opacity:'0.72', pointerEvents:'none', zIndex:'200',
    boxShadow:'0 8px 24px rgba(0,0,0,0.18)', borderRadius:'9px',
    background:'#fff', transition:'none'
  });
  dragGhost._baseTop  = rect.top;
  dragGhost._baseLeft = rect.left;
  document.body.appendChild(dragGhost);

  dragOver = document.createElement('div');
  dragOver.className = 'tl-drop-placeholder';
  Object.assign(dragOver.style, {
    height: rect.height+'px', borderRadius:'9px',
    background:'rgba(14,122,135,0.07)',
    border:'2px dashed rgba(14,122,135,0.28)',
    margin:'2px 0', boxSizing:'border-box'
  });
  dragEl.parentNode.insertBefore(dragOver, dragEl);
  Object.assign(dragEl.style, { opacity:'0', pointerEvents:'none', height:'0', overflow:'hidden', margin:'0', padding:'0' });
}

function updateDropTarget(clientY) {
  if (!dragOver) return;
  // Find which section the pointer is over
  let targetSection = null;
  document.querySelectorAll('.tl-section').forEach(sec => {
    const r = sec.getBoundingClientRect();
    if (clientY >= r.top && clientY <= r.bottom) targetSection = sec;
  });
  const tl = targetSection ? targetSection.querySelector('.timeline') : dragEl.closest('.timeline');
  if (!tl) return;

  // Move placeholder into this list if needed
  if (dragOver.parentNode !== tl) tl.appendChild(dragOver);

  const siblings = [...tl.querySelectorAll('.tl-item')].filter(el => el !== dragEl && el.style.height !== '0px');
  let before = null;
  for (const sib of siblings) {
    const r = sib.getBoundingClientRect();
    if (clientY < r.top + r.height / 2) { before = sib; break; }
  }
  tl.insertBefore(dragOver, before || null);
}

function onDragEnd() {
  window.removeEventListener('pointermove',   onDragMove);
  window.removeEventListener('pointerup',     onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  if (!dragMoved || !dragEl) { dragCleanup(); return; }

  const tl = dragOver ? dragOver.parentNode : document.querySelector('.tl-section .timeline');
  if (tl && dragOver) tl.insertBefore(dragEl, dragOver);
  if (dragOver) { dragOver.remove(); dragOver = null; }
  ['opacity','pointerEvents','height','overflow','margin','padding'].forEach(p => dragEl.style[p] = '');

  // Rebuild items array from new DOM order across all period sections
  const allItems = STATE.days[activeDay].items;
  const newItems = [];
  document.querySelectorAll('.tl-section').forEach(section => {
    const periodKey = section.dataset.period;
    section.querySelectorAll('.tl-item').forEach(el => {
      const i = parseInt(el.dataset.idx);
      const it = allItems[i];
      if (it) { it.period = periodKey; newItems.push(it); }
    });
  });
  if (newItems.length) STATE.days[activeDay].items = newItems;

  dragCleanup();
  scheduleSave();
  renderTimeline();
  renderRightPanel();
}

function dragCleanup() {
  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
  if (dragOver)  { dragOver.remove();  dragOver  = null; }
  if (dragEl) {
    ['opacity','pointerEvents','height','overflow','margin','padding'].forEach(p => dragEl.style[p] = '');
    dragEl = null;
  }
  dragMoved = false;
}

function renderRightPanel() {
  renderHotelPanel();

// Parse dd/mm/yyyy → Date for comparison
function parseDate(str) {
  if (!str) return null;
  const [d,m,y] = str.split('/').map(Number);
  return new Date(y, m-1, d);
}

// Find the hotel covering the active day (checkin <= day < checkout)
function hotelForDay(dayIdx) {
  const hotels = STATE.meta.hotels || (STATE.meta.hotel ? [STATE.meta.hotel] : []);
  if (!hotels.length) return null;
  const dayDate = parseDate(STATE.days[dayIdx]?.date);
  if (!dayDate) return hotels[0]; // no date — show first
  for (const h of hotels) {
    const ci = parseDate(h.checkin);
    const co = parseDate(h.checkout);
    if (ci && co && dayDate >= ci && dayDate < co) return h;
  }
  // Fallback: closest upcoming
  return hotels.find(h => parseDate(h.checkin) >= dayDate) || hotels[hotels.length-1];
}

function renderHotelCard(h, hotelIdx) {
  // Photo area — real image if stored, else teal gradient placeholder
  // Three-dot edit button sits in top-right corner of the image
  const editBtn = `<button class="hotel-edit-btn" onclick="openHotelModal(${hotelIdx})" title="Edit accommodation">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
  </button>`;

  const imgHtml = h.photo
    ? `<div class="hotel-img" style="background:url('${h.photo}') center/cover no-repeat;">
         <div class="hotel-img-overlay"></div>
         ${editBtn}
       </div>`
    : `<div class="hotel-img hotel-img-placeholder">
         <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
         <span class="hotel-img-lbl">${h.name||'Hotel'}</span>
         ${editBtn}
       </div>`;

  // Nights calculation — use stored value or compute from dates
  let nights = h.nights || '';
  if (!nights && h.checkin && h.checkout) {
    const ci = parseDate(h.checkin), co = parseDate(h.checkout);
    if (ci && co) nights = Math.round((co - ci) / 86400000);
  }

  // Google Maps link
  const mapsUrl = h.name
    ? 'https://www.google.com/maps/search/' + encodeURIComponent(h.name + (h.city ? ', ' + h.city : ''))
    : 'https://www.google.com/maps';

  // Rate/night + Booking ref — label·value on same line (not two-column grid)
  const rateRefRow = [
    h.nightly && `<div class="h-row"><div class="h-row-k">Rate</div><div class="h-row-v">${h.nightly}</div></div>`,
    h.ref     && `<div class="h-row"><div class="h-row-k">Reference</div><div class="h-row-v h-ref">${h.ref}</div></div>`,
  ].filter(Boolean).join('');

  const bfText = h.breakfast === 'included' ? 'Included' : 'Not included';
  const rows = [
    h.name     && `<div class="h-row"><div class="h-row-k">Hotel</div><div class="h-row-v h-name">${h.name}</div></div>`,
    h.checkin  && `<div class="h-row"><div class="h-row-k">Check in</div><div class="h-row-v">${h.checkin}</div></div>`,
    h.checkout && `<div class="h-row"><div class="h-row-k">Check out</div><div class="h-row-v">${h.checkout}</div></div>`,
    nights     && `<div class="h-row"><div class="h-row-k">Nights</div><div class="h-row-v">${nights}</div></div>`,
    rateRefRow,
    `<div class="h-row"><div class="h-row-k">Breakfast</div><div class="h-row-v ${h.breakfast==='included'?'h-bf-yes':'h-bf-no'}">${bfText}</div></div>`,
  ].filter(Boolean).join('');

  return `<div class="hotel-card">
    ${imgHtml}
    <div class="hotel-body">
      ${rows}
      <a class="hotel-map-btn" href="${mapsUrl}" target="_blank" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/></svg>
        Open in Maps
      </a>
    </div>
  </div>`;
}

function renderHotelPanel() {
  const el = document.getElementById('rp-hotel');

function renderReadiness() {
  const items = STATE.days.flatMap(d => d.items||[]).filter(Boolean);
  const booked = items.filter(it => it.status==='booked'||it.status==='confirmed').length;
  const total  = items.filter(it => it.status).length;
  const pct    = total ? Math.round((booked/total)*100) : 100;
  const warns  = items.filter(it => it.status==='attention').length;
  const hasHotel = !!STATE.meta.hotel;
  const circumference = 2 * Math.PI * 22;
  const offset = circumference * (1 - pct/100);

  document.getElementById('rp-readiness').innerHTML = `
    <div class="readiness-ring">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="22" fill="none" stroke="rgba(14,122,135,0.15)" stroke-width="5"/>
        <circle cx="26" cy="26" r="22" fill="none" stroke="#0e7a87" stroke-width="5"
          stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
          stroke-linecap="round" transform="rotate(-90 26 26)"/>
      </svg>
      <div><div class="ring-pct">${pct}%</div><div class="ring-label">${pct>=100?'All set!':pct>=80?'Almost there!':'In progress'}</div></div>
    </div>
    <div class="r-list">
      <div class="r-row ${hasHotel?'ok':'tbc'}">${hasHotel?ICO.check:ICO.circle} ${hasHotel?'Hotel confirmed':'No hotel added yet'}</div>
      <div class="r-row ${booked>0?'ok':'tbc'}">${booked>0?ICO.check:ICO.circle} ${booked} item${booked===1?'':'s'} booked</div>
      ${warns ? `<div class="r-row warn">${ICO.warn} ${warns} need${warns===1?'s':''} attention</div>` : ''}
    </div>`;
}

function renderBudget() {
  const budgetUrl = budgetPageUrl;

  document.getElementById('rp-budget').innerHTML = `

      <div class="bb-row"><div class="bb-lbl">Stay</div><div class="bb-track"><div class="bb-fill" style="width:${pct(b.stay)}%"></div></div><div class="bb-val">£${b.stay||0}</div></div>
      <div class="bb-row"><div class="bb-lbl">Food</div><div class="bb-track"><div class="bb-fill food" style="width:${pct(b.food)}%"></div></div><div class="bb-val">£${b.food||0}</div></div>
      <div class="bb-row"><div class="bb-lbl">Activities</div><div class="bb-track"><div class="bb-fill act" style="width:${pct(b.act)}%"></div></div><div class="bb-val">£${b.act||0}</div></div>
      <div class="bb-row"><div class="bb-lbl">Transport</div><div class="bb-track"><div class="bb-fill trans" style="width:${pct(b.trans)}%"></div></div><div class="bb-val">£${b.trans||0}</div></div>

function renderKeyBookings() {
  const items = STATE.days.flatMap(d => (d.items||[]).map(it => it && it.booking ? {day:d.date, ...it} : null)).filter(Boolean);
  const el = document.getElementById('rp-bookings');

      <div class="bk-meta">${it.day||''} ${it.time?'· '+it.time:''} · ${badgeHtml(it.status)}</div></div></div>`;

}

function openDrawerItem(dayIdx, itemIdx) {
  const item = STATE.days[dayIdx]?.items?.[itemIdx];
  if (!item || item.conn !== undefined) return;
  drawerItem = { dayIdx, itemIdx };
  document.getElementById('dr-kicker').textContent = item.kicker || item.type || 'Activity';
  document.getElementById('dr-title').textContent  = item.title || '';
  document.getElementById('dr-sub').textContent    = item.sub || '';
  document.getElementById('dr-status-row').innerHTML = badgeHtml(item.status, item.statusLabel);
  const b = item.booking;
  let bHtml = '';
  if (b) {
    bHtml = `<div class="dr-section-h">Booking details</div>`;
    if (b.ref)     bHtml += `<div class="dr-field"><div class="dr-field-k">Reference</div><div class="dr-field-v ref">${b.ref}</div></div>`;
    if (b.price)   bHtml += `<div class="dr-field"><div class="dr-field-k">Price</div><div class="dr-field-v">${b.price}</div></div>`;
    if (b.tickets) bHtml += `<div class="dr-field"><div class="dr-field-k">Tickets</div><div class="dr-field-v">${b.tickets}</div></div>`;
    if (b.url)     bHtml += `<div class="dr-field"><div class="dr-field-k">Link</div><div class="dr-field-v link" onclick="window.open('${b.url}','_blank')">${b.url}</div></div>`;
    if (b.note)    bHtml += `<div class="dr-field"><div class="dr-field-k">Notes</div><div class="dr-field-v" style="font-weight:500;color:var(--text2)">${b.note}</div></div>`;
    document.getElementById('dr-open-btn').style.display = b.url ? 'block' : 'none';
    document.getElementById('dr-open-btn').onclick = () => window.open(b.url,'_blank');
  } else {
    document.getElementById('dr-open-btn').style.display = 'none';
  }
  document.getElementById('dr-booking-body').innerHTML = bHtml;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');

  // Show / generate About section for activity and ticketed types
  if (item.type === 'act' || item.type === 'ticket') {
    if (item._about) {
      renderAbout(item._about);
    } else {
      generateAbout(false);
    }
  } else {
    document.getElementById('dr-about-wrap').style.display    = 'none';
    document.getElementById('dr-about-loading').style.display = 'none';
    document.getElementById('dr-about-retry').style.display   = 'none';
  }
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('dr-about-body').innerHTML = '';
}

function editCurrentItem() {
  if (!drawerItem) return;
  closeDrawer();
  openEditItem(drawerItem.dayIdx, drawerItem.itemIdx);
}

function deleteCurrentItem() {
  if (!drawerItem) return;
  if (!confirm('Delete this activity?')) return;
  const items = STATE.days[drawerItem.dayIdx].items;
  // snapshot first so it's recoverable
  takeSnapshot();
  items.splice(drawerItem.itemIdx, 1);
  closeDrawer();
  closeModal();
  scheduleSave();
  render();
  showSnapshotBar(true);
  setTimeout(() => showSnapshotBar(false), 6000);
}

  const refItem = STATE.days[dayIdx]?.items?.[itemIdx];

function saveItem() {
  if (document.getElementById('tab-bulk').classList.contains('active')) {
    saveBulkItems(); return;
  }
  const type   = document.getElementById('f-type').value;
  const period = document.getElementById('f-period').value || 'morning';
  let time, title, sub, statusV, conn, item;

  if (type === 'move') {
    const tType  = document.getElementById('f-transport-type').value;
    const from   = document.getElementById('f-from').value.trim();
    const to     = document.getElementById('f-to').value.trim();
    const depart = document.getElementById('f-depart').value;
    const arrive = document.getElementById('f-arrive').value;
    statusV      = document.getElementById('f-status-move').value;
    if (!from && !to) { document.getElementById('f-from').focus(); return; }
    const icoMap = { Flight:'plane', Train:'move', Coach:'move', Bus:'move', Ferry:'move', Other:'move' };
    time  = depart;
    title = [from, to].filter(Boolean).join(' → ');
    sub   = [tType, depart && arrive ? depart + ' – ' + arrive : (depart||arrive)].filter(Boolean).join(' · ');
    item  = { time, type, period, title, sub, status: statusV || null,
              transport: { mode: tType, from, to, depart, arrive },
              icoType: icoMap[tType] || 'move', kicker: tType };
  } else {
    time   = document.getElementById('f-time').value;
    title  = document.getElementById('f-title').value.trim();
    sub    = document.getElementById('f-sub').value.trim();
    statusV= document.getElementById('f-status').value;
    conn   = document.getElementById('f-conn').value.trim();
    if (!title) { document.getElementById('f-title').focus(); return; }
    item   = { time, type, period, title, sub, status: statusV || null };
    if (conn) item.conn = conn;
  }

  if (bookingVisible) {
    const ref = document.getElementById('f-ref').value.trim();
    const price = document.getElementById('f-price').value.trim();
    const tickets = document.getElementById('f-tickets').value.trim();
    const url = document.getElementById('f-url').value.trim();
    const note = document.getElementById('f-note').value.trim();
    if (ref||price||tickets||url||note) {
      item.booking = { ref, price, tickets, url, note };
      item.status = item.status || 'booked';
    }
  }

  const items = STATE.days[activeDay].items;
  if (editItem && editItem.dayIdx === activeDay) {
    const ri = editItem.item ? items.indexOf(editItem.item) : -1;
    items[ri !== -1 ? ri : editItem.itemIdx] = item;
  } else {
    // Insert sorted by time
    const toMins = t => { const [h,m]=(t||'').split(':').map(Number); return isNaN(h)?9999:h*60+(m||0); };
    const pos = items.findIndex(it => it && !it.conn && toMins(it.time) > toMins(time));
    if (pos === -1) items.push(item); else items.splice(pos, 0, item);
  }

  // Unhide the period if it was hidden
  const day = STATE.days[activeDay];
  if (day._hiddenPeriods && day._hiddenPeriods.includes(period)) {
    day._hiddenPeriods = day._hiddenPeriods.filter(p => p !== period);
  }

  closeModal();
  scheduleSave();
  render();
}

async function triggerShare() {
  try {
    const token = await dbCreateShare(RECORD_ID);
    const url = location.origin + '/share.html?t=' + token;
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(url);
      alert('Share link copied to clipboard:\n' + url);
    } else {
      prompt('Share link (copy it):', url);
    }
  } catch(e) {
    alert('Could not create share link. ' + e.message);
  }
}

function setModalTab(tab) {
  const isBulk = tab === 'bulk';
  document.getElementById('modal-body-bulk').style.display   = isBulk ? 'flex' : 'none';
  document.getElementById('modal-body-single').style.display = isBulk ? 'none' : 'flex';

  document.getElementById('tab-bulk').classList.toggle('active',  isBulk);

  if (isBulk) setTimeout(() => document.getElementById('f-bulk-list').focus(), 80);
}

function saveBulkItems() {
  const raw    = document.getElementById('f-bulk-list').value;
  const period = document.getElementById('f-bulk-period').value;
  const type   = document.getElementById('f-bulk-type').value;
  const lines  = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) {
    document.getElementById('f-bulk-list').focus();
    return;
  }
  const kicker = period.charAt(0).toUpperCase() + period.slice(1);
  const icoMap = { meal:'utensils', move:'move', act:'pin' };
  lines.forEach(line => {
    STATE.days[activeDay].items.push({
      type, period, kicker, title: line,
      icoType: icoMap[type] || 'pin',
      sub: '', status: null, booking: null,
    });
  });
  closeModal();
  scheduleSave();
  renderTimeline();
  renderRightPanel();
}

function clearPeriod(periodKey) {
  const day   = STATE.days[activeDay];
  const items = day.items || [];
  const count = items.filter(it => it && (it.period || inferPeriod(it)) === periodKey).length;

  if (count > 0) {
    if (!confirm('Remove all ' + count + ' ' + periodKey + ' item' + (count !== 1 ? 's' : '') + ' from this day?')) return;
    takeSnapshot();
    day.items = items.filter(it => !it || (it.period || inferPeriod(it)) !== periodKey);
  }

  // Hide the section
  if (!day._hiddenPeriods) day._hiddenPeriods = [];
  if (!day._hiddenPeriods.includes(periodKey)) day._hiddenPeriods.push(periodKey);

  scheduleSave();
  renderTimeline();
  renderRightPanel();
  if (count > 0) {
    showSnapshotBar(true);
    setTimeout(() => showSnapshotBar(false), 6000);
  }
}

let editHotelIdx = null;  // index into STATE.meta.hotels, or null for new
let fetchedPhotoUrl = null;

function openHotelModal(idx) {
  editHotelIdx = (idx !== undefined) ? idx : null;

// Resize image to max 800×500 and convert to base64
function resizeAndEncode(file, maxW, maxH) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let w = img.width, h = img.height;
      const ratio = Math.min(maxW / w, maxH / h, 1);
      w = Math.round(w * ratio); h = Math.round(h * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onHotelPhotoSelected(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('hotel-photo-status');
  status.textContent = 'Processing…'; status.style.display = 'block';
  try {
    const b64 = await resizeAndEncode(file, 800, 500);
    fetchedPhotoUrl = b64;
    showHotelPhotoPreview(b64);
    // Show approx size
    const kb = Math.round(b64.length * 0.75 / 1024);
    document.getElementById('hotel-photo-size').textContent = kb + ' KB stored';
    status.style.display = 'none';
  } catch(e) {
    status.textContent = 'Could not process image.'; 
  }
}

function saveHotel() {
  const name    = document.getElementById('hf-name').value.trim();
  const checkin = document.getElementById('hf-checkin').value.trim();
  const checkout= document.getElementById('hf-checkout').value.trim();
  const nightly = document.getElementById('hf-nightly').value.trim();
  const ref     = document.getElementById('hf-ref').value.trim();
  if (!name) { document.getElementById('hf-name').focus(); return; }

  // Use uploaded/stored photo
  let photo = fetchedPhotoUrl || null;

  // Compute nights
  let nights = '';
  if (checkin && checkout) {
    const ci = parseDate(checkin), co = parseDate(checkout);
    if (ci && co) nights = Math.round((co - ci) / 86400000);
  }

  const breakfast = document.getElementById('hf-breakfast').value;
  const hotel = { name, checkin, checkout, nights, nightly, ref, breakfast, photo: photo || null };

  // Remove any hotel-generated breakfast items from old version of this hotel
  const oldHotel = (editHotelIdx !== null && STATE.meta.hotels) ? STATE.meta.hotels[editHotelIdx] : null;
  if (oldHotel) removeHotelBreakfasts(oldHotel);

  if (!STATE.meta.hotels) STATE.meta.hotels = [];
  if (editHotelIdx !== null) {
    STATE.meta.hotels[editHotelIdx] = hotel;
  } else {
    STATE.meta.hotels.push(hotel);
  }

  // Add breakfast items to days covered by this hotel (day after checkin up to checkout)
  if (breakfast === 'included') addHotelBreakfasts(hotel);

  closeHotelModal();
  scheduleSave();
  render();
}

// Find all days whose date falls between checkin (exclusive) and checkout (inclusive)
// i.e. Day 2 of the stay onwards — you've slept there, breakfast is available
function daysForHotelBreakfast(hotel) {
  const ci = parseDate(hotel.checkin);
  const co = parseDate(hotel.checkout);
  if (!ci || !co) return [];
  return STATE.days.filter(d => {
    const dt = parseDate(d.date);
    return dt && dt > ci && dt <= co;
  });
}

function addHotelBreakfasts(hotel) {
  daysForHotelBreakfast(hotel).forEach(day => {
    // Don't add if a hotel breakfast already exists for this hotel
    const already = (day.items || []).some(it =>
      it && it._hotelBreakfast === hotel.name
    );
    if (already) return;
    if (!day.items) day.items = [];
    // Insert at start of morning items
    day.items.unshift({
      time:     null,
      type:     'meal',
      period:   'morning',
      icoType:  'coffee',
      kicker:   'Breakfast',
      title:    'Breakfast — ' + hotel.name,
      sub:      'Included with stay',
      status:   'confirmed',
      booking:  null,
      _hotelBreakfast: hotel.name,  // tag so we can remove it later
    });
  });
}

function removeHotelBreakfasts(hotel) {
  STATE.days.forEach(day => {
    day.items = (day.items || []).filter(it =>
      !(it && it._hotelBreakfast === hotel.name)
    );
  });
}

function deleteHotel() {
  if (editHotelIdx === null) return;
  if (!confirm('Remove this hotel?')) return;
  takeSnapshot();
  STATE.meta.hotels.splice(editHotelIdx, 1);
  closeHotelModal();
  scheduleSave();
  renderHotelPanel();
}

// ── ABOUT THIS PLACE ─────────────────────────────────────────────────
async function generateAbout(force) {
  if (!drawerItem) return;
  const item = STATE.days[drawerItem.dayIdx]?.items?.[drawerItem.itemIdx];
  if (!item || !item.title) return;

  // Don't re-fetch if we already have it and not forced
  if (item._about && !force) { renderAbout(item._about); return; }

  // Show loading
  document.getElementById('dr-about-wrap').style.display    = 'none';
  document.getElementById('dr-about-loading').style.display = 'block';
  document.getElementById('dr-about-retry').style.display   = 'none';

  try {
    const city = STATE.days[drawerItem.dayIdx]?.loc || STATE.meta?.dest || '';

    // Fire both requests in parallel — about text + photo
    const [aboutResp, photoResp] = await Promise.all([
      fetch('/api.php?action=generate_about', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Auth-Token': AUTH_TOKEN },
        body: JSON.stringify({ place: item.title, city }),
      }),
      fetch('/api.php?action=place_photo_v2&q=' + encodeURIComponent(item.title) + '&city=' + encodeURIComponent(city), {
        headers: { 'X-Auth-Token': AUTH_TOKEN },
      }).then(r => r.json()).catch(() => ({ photo: null })),
    ]);
    const j = await aboutResp.json();

    document.getElementById('dr-about-loading').style.display = 'none';

    if (j.ok && j.data?.about) {
      item._about = j.data.about;
      // Attach photo from parallel fetch
      item._about.photo = photoResp.data?.photo || photoResp.photo || null;
      scheduleSave();
      renderAbout(item._about);
    } else if (j.data?.error === 'No API key configured') {
      // API key not set — show retry button with hint
      document.getElementById('dr-about-retry').style.display = 'block';
      document.getElementById('dr-about-retry').textContent = '↻ Generate visitor info (API key needed)';
    } else {
      document.getElementById('dr-about-retry').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('dr-about-loading').style.display = 'none';
    document.getElementById('dr-about-retry').style.display   = 'block';
  }
}

function renderAbout(about) {
  // History bullets
  const historyHtml = (about.history || []).map(f =>
    `<li>${f}</li>`
  ).join('');

  // Lookout bullets
  const lookoutHtml = (about.lookout || []).map(f =>
    `<li>${f}</li>`
  ).join('');

  document.getElementById('dr-about-body').innerHTML = `
    ${about.photo ? `<img src="${about.photo}" alt="" class="ab-photo">` : ''}
    <div class="ab-section">
      <div class="ab-icon-h">Why it's significant</div>
      <p class="ab-p">${about.significant || ''}</p>
    </div>
    ${(historyHtml || lookoutHtml) ? `<div class="ab-section">
      <div class="ab-icon-h">Key facts &amp; what to look out for</div>
      <ul class="ab-list">${historyHtml}${lookoutHtml}</ul>
    </div>` : ''}
    ${about.fact ? `<div class="ab-section ab-fact">
      <div class="ab-icon-h">Interesting fact</div>
      <p class="ab-p">${about.fact}</p>
    </div>` : ''}
    <button onclick="generateAbout(true)" class="ab-regen">↻ Regenerate</button>
  `;

  document.getElementById('dr-about-wrap').style.display = 'block';
}

function parsePrice(str, numTrav) {
  if (!str) return null;
  const pp = /pp/i.test(str);
  const m  = String(str).replace(/,/g,'').match(/[\d.]+/);
  if (!m) return null;
  return parseFloat(m[0]) * (pp ? numTrav : 1);
}

function extractBudget(state) {
  const numTrav = parseInt(state.meta && state.meta.trav ? state.meta.trav : trav) || 2;
  const parsePr = str => parsePrice(str, numTrav);
  const hotels = (state.meta && state.meta.hotels ? state.meta.hotels : []).map(h => {
    const ci = parseDate(h.checkin), co = parseDate(h.checkout);
    const nights = h.nights || (ci && co ? Math.round((co-ci)/86400000) : null);
    const nightly = parsePr(h.nightly);
    return { ...h, nights, nightly, total: nightly && nights ? nightly * nights : null };
  });
  const flights = [], transport = [], attractions = [];
  for (const d of state.days || []) {
    for (const it of (d.items || [])) {
      if (!it) continue;
      const b = it.booking || {};
      const price = parsePr(b.price);
      if (it.type === 'move') {
        const k = it.kicker || (it.transport && it.transport.mode) || 'Transport';
        if (k === 'Flight') flights.push({title:it.title, kicker:k, price, rawPrice:b.price, date:d.date, ref:b.ref, avios:it._avios||null});
        else if (price) transport.push({title:it.title, kicker:k, price, rawPrice:b.price, date:d.date});
      } else if ((it.type === 'act' || it.type === 'ticket') && price) {
        attractions.push({title:it.title, price, rawPrice:b.price, date:d.date, ref:b.ref, tickets:b.tickets, url:b.url});
      }
    }
  }
  return { hotels, flights, transport, attractions, numTrav };
}

function renderBudgetView() {
  const el = document.getElementById('budget-main');
  if (!STATE || !STATE.days) { el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">No data</div>'; return; }
  const { hotels, flights, transport, attractions, numTrav } = extractBudget(STATE);
  const fmt = n => n ? '\xA3' + n.toFixed(2).replace(/\.00$/, '') : '\u2014';
  const hotelTotal  = hotels.reduce((a,h) => a+(h.total||0), 0);
  const flightTotal = flights.reduce((a,f) => a+(f.price||0), 0);
  const transTotal  = transport.reduce((a,t) => a+(t.price||0), 0);
  const actTotal    = attractions.reduce((a,a2) => a+(a2.price||0), 0);
  const grand       = hotelTotal + flightTotal + transTotal + actTotal;
  const perPerson   = numTrav > 1 ? grand / numTrav : null;
  const totalAvios  = flights.reduce((a,f) => a+(parseInt(f.avios)||0), 0);

  const cats = [
    {label:'Hotel', val:hotelTotal, color:'#0e7a87'},
    {label:'Flights', val:flightTotal, color:'#6366f1'},
    {label:'Transport', val:transTotal, color:'#d97b0a'},
    {label:'Activities', val:actTotal, color:'#1a8a52'},
  ];

  const summaryHtml = `<div class="bv-summary">
    <div class="bv-grand">
      <div class="bv-grand-label">Total trip cost</div>
      <div class="bv-grand-val">${fmt(grand)}</div>
      ${perPerson ? `<div class="bv-grand-pp">${fmt(perPerson)} per person</div>` : ''}
      ${totalAvios ? `<div class="bv-grand-avios">\u2726 ${totalAvios.toLocaleString()} Avios</div>` : ''}
    </div>
    <div class="bv-cat-bars">
      ${cats.filter(c=>c.val).map(c => {
        const pct = grand ? Math.round((c.val/grand)*100) : 0;
        return `<div class="bv-cat-row">
          <div class="bv-cat-dot" style="background:${c.color}"></div>
          <div class="bv-cat-name">${c.label}</div>
          <div class="bv-cat-bar-wrap"><div class="bv-cat-bar" style="width:${pct}%;background:${c.color}"></div></div>
          <div class="bv-cat-val">${fmt(c.val)}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  const mkRow = (name, meta, cost, rawCost, extra) =>
    `<div class="bv-row"><div class="bv-row-info"><div class="bv-row-name">${name}</div>${meta?`<div class="bv-row-meta">${meta}</div>`:''} ${extra||''}</div><div class="bv-row-right"><div class="bv-row-cost">${fmt(cost)}</div>${rawCost&&rawCost!==fmt(cost)?`<div class="bv-row-sub">${rawCost}</div>`:''}</div></div>`;

  const mkPanel = (title, color, rows, footHtml) =>
    `<div class="bv-panel"><div class="bv-panel-head" style="border-left:3px solid ${color}"><span class="bv-panel-title">${title}</span></div><div class="bv-panel-body">${rows||'<div class="bv-empty">None logged</div>'}</div>${footHtml?`<div class="bv-panel-foot">${footHtml}</div>`:''}</div>`;

  const hotelRows  = hotels.map(h => mkRow(h.name, `${h.checkin||''} \u2192 ${h.checkout||''} \u00B7 ${h.nights||'?'} nights${h.breakfast==='included'?' \u00B7 Breakfast incl.':''}${h.ref?' \u00B7 Ref: '+h.ref:''}`, h.total, null, h.nightly?`<div class="bv-row-sub">${fmt(h.nightly)}/night</div>`:'')).join('');
  const flightRows = flights.map((f,i) => mkRow(f.title, `${f.date||''}${f.ref?' \u00B7 Ref: '+f.ref:''}`, f.price, f.rawPrice, `<div class="bv-row-avios">\u2726 <input class="bv-avios-input" placeholder="Add Avios" value="${f.avios||''}" onchange="saveBudgetAvios(${i},this.value)"></div>`)).join('');
  // Group transport by day
  const transByDay = {};
  transport.forEach(t => {
    const key = t.date || 'Unknown';
    if (!transByDay[key]) transByDay[key] = { date: key, items: [], total: 0 };
    transByDay[key].items.push(t.title);
    transByDay[key].total += (t.price || 0);
  });
  const transRows = Object.values(transByDay).sort((a,b) => a.date.localeCompare(b.date)).map(day =>
    mkRow(day.date, day.items.join(', '), day.total, null, '')
  ).join('');
  const actRows    = attractions.map(a => mkRow(a.title, `${a.date||''}${a.tickets?' \u00B7 '+a.tickets:''}`, a.price, a.rawPrice, '')).join('');

  el.innerHTML = summaryHtml + `<div class="bv-grid">
    ${mkPanel('Accommodation', '#0e7a87', hotelRows, hotelTotal?`<div class="bv-foot-row"><span>Total stay</span><span>${fmt(hotelTotal)}</span></div>`:'')}
    ${mkPanel('Flights', '#6366f1', flightRows, [flightTotal?`<div class="bv-foot-row"><span>Total</span><span>${fmt(flightTotal)}</span></div>`:'', totalAvios?`<div class="bv-foot-row"><span>Avios</span><span style="color:#6366f1">${totalAvios.toLocaleString()}</span></div>`:''].filter(Boolean).join(''))}
    ${mkPanel('Transport', '#d97b0a', transRows, transTotal?`<div class="bv-foot-row"><span>Total</span><span>${fmt(transTotal)}</span></div>`:'')}
    ${mkPanel('Activities', '#1a8a52', actRows, [actTotal?`<div class="bv-foot-row"><span>Total</span><span>${fmt(actTotal)}</span></div>`:'', perPerson?`<div class="bv-foot-row"><span>Per person</span><span>${fmt(perPerson)}</span></div>`:''].filter(Boolean).join(''))}
  </div>`;
}

async function saveBudgetAvios(flightIdx, value) {
  const num = parseInt(value) || null;
  let fi = 0;
  for (const d of STATE.days || []) {
    for (const it of (d.items || [])) {
      if (!it || it.type !== 'move') continue;
      const k = it.kicker || (it.transport && it.transport.mode) || '';
      if (k === 'Flight') { if (fi === flightIdx) { it._avios = num; break; } fi++; }
    }
  }
  scheduleSave();
  renderBudgetView();
}

// Wait for auth.js + db.js to be ready, then init
(function waitForAuth() {
  if (typeof isAuthed !== 'function' || typeof dbLoad !== 'function') {
    setTimeout(waitForAuth, 50); return;
  }
  if (!isAuthed()) {
    // Not authed — auth.js will show PIN overlay, wait for it to complete
    setTimeout(waitForAuth, 200); return;
  }
  init().catch(e => {
    console.error('Init failed:', e);
    document.getElementById('tb-kicker').textContent = 'Error: ' + (e && e.message ? e.message.slice(0,50) : 'unknown');
  });
})();
