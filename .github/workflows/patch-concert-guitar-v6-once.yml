name: Patch Concert Log guitar v6 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-concert-guitar-v6-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Switch Concerts stat to redrawn PNG guitar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('concerts/index.html')
          page = page_path.read_text()
          page2, n = re.subn(
              r'/icons/concert-concerts\.(?:svg|png)\?v=\d+',
              '/icons/concert-concerts.png?v=6',
              page,
          )
          if n == 0:
              raise SystemExit('Concerts icon reference not found')
          page_path.write_text(page2)

          deploy_path = Path('deploy-webhook.php')
          deploy = deploy_path.read_text()
          png_line = "    'icons/concert-concerts.png' => 'icons/concert-concerts.png',"
          if png_line not in deploy:
              svg_line = "    'icons/concert-concerts.svg' => 'icons/concert-concerts.svg',"
              if svg_line not in deploy:
                  raise SystemExit('Concert icon deployment allowlist entry not found')
              deploy = deploy.replace(svg_line, svg_line + '\n' + png_line, 1)
              deploy_path.write_text(deploy)
          PY

      - name: Commit redrawn Concert Log guitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts/index.html deploy-webhook.php
          git commit -m "Use redrawn guitar icon in Concert Log"
          git pull --rebase origin main
          git push origin main
