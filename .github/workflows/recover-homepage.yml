name: Recover homepage deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh deploy webhook
        run: |
          curl --fail --show-error --silent --retry 2 --retry-delay 2 \
            --header "X-Deploy-Key: ${{ secrets.DEPLOY_KEY }}" \
            --output /tmp/deploy-first.json \
            "https://joelpagett.co.uk/deploy-webhook.php"

      - name: Deploy homepage core with refreshed webhook
        run: |
          sleep 2
          curl --fail --show-error --silent --retry 2 --retry-delay 2 \
            --header "X-Deploy-Key: ${{ secrets.DEPLOY_KEY }}" \
            --output /tmp/deploy-second.json \
            "https://joelpagett.co.uk/deploy-webhook.php"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/deploy-second.json').read_text())
          if payload.get('ok') is not True:
              raise SystemExit('recovery deploy did not report success')
          copied = payload.get('copied') or []
          if 'home.php' not in copied or 'home-core.php' not in copied:
              raise SystemExit('homepage renderer files were not both deployed')
          print('homepage renderer files deployed')
          PY

      - name: Verify recovered homepage theme
        run: |
          curl --fail --show-error --silent \
            "https://joelpagett.co.uk/" \
            --output /tmp/home.html
          grep -q 'id="homepage-section-colours"' /tmp/home.html
          grep -q 'linear-gradient(145deg,#0d8794' /tmp/home.html
          grep -q 'linear-gradient(145deg,#8271ad' /tmp/home.html
          echo 'homepage recovered with section colour theme'
