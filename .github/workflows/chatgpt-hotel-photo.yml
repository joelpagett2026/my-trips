name: ChatGPT hotel photo test

on:
  push:
    branches:
      - chatgpt/increase-hotel-photo

permissions:
  contents: write

jobs:
  increase-hotel-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Increase hotel photo height by 50px
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('itinerary-v2-style.css')
          text = path.read_text()
          pattern = r'(\.rp2-hotel-photo-wrap\s*\{.*?height:\s*)155px'
          new_text, count = re.subn(pattern, r'\g<1>205px', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Target CSS rule not found; no change made.')
          path.write_text(new_text)
          PY

      - name: Commit change
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-v2-style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Increase hotel photo height by 50px'
          git push
