name: Validate backup recovery readiness

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  recovery-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate recovery checker syntax
        run: python -m py_compile scripts/check-backup-recovery.py

      - name: Exercise recovery checker fixtures
        run: python scripts/check-backup-recovery.py --self-test
