name: Patch Concert Log icons v2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-concert-icons-v2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Apply simplified Concert Log icons
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('concerts/index.html')
          page = page_path.read_text()
          old_size = '    width: 22px; height: 22px; background: currentColor; display: inline-block;'
          new_size = '    width: 24px; height: 24px; background: currentColor; display: inline-block;'
          if old_size in page:
              page = page.replace(old_size, new_size, 1)
          elif new_size not in page:
              raise SystemExit('Concert stat icon size CSS not found')

          for icon in ('concert-concerts', 'concert-festivals', 'concert-artists'):
              page = page.replace(f'/icons/{icon}.svg?v=1', f'/icons/{icon}.svg?v=2')
          page_path.write_text(page)

          icons = {
              'icons/concert-concerts.svg': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 52c-6-5-7-14-2-20 4-5 9-6 14-5l7-8 13 13-8 7c1 5 0 10-5 14-6 5-14 5-19-1z"/><path d="M32 19 49 2l13 13-17 17"/><path d="M40 11 53 24"/><circle cx="21" cy="42" r="4"/><path d="M28 34l7 7"/></svg>',
              'icons/concert-festivals.svg': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M27 8h10v7H27z"/><circle cx="32" cy="36" r="22"/><path d="M10 31h44M10 41h44M20 18c7 10 7 26 0 36M44 18c-7 10-7 26 0 36M32 14v44"/><path d="M8 12v8M4 16h8M54 49v8M50 53h8"/></svg>',
              'icons/concert-artists.svg': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-38 32 32)"><rect x="20" y="6" width="24" height="27" rx="12"/><path d="M22 15h20M22 22h20"/><path d="M26 32h12v24c0 3-2 5-6 5s-6-2-6-5V32z"/></g></svg>',
          }
          for path, content in icons.items():
              Path(path).write_text(content + '\n')

          Path('.github/workflows/patch-concert-icons-v2-once.yml').unlink()
          PY

      - name: Commit icon update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts/index.html icons/concert-concerts.svg icons/concert-festivals.svg icons/concert-artists.svg .github/workflows/patch-concert-icons-v2-once.yml
          git commit -m "Use simplified Concert Log icons"
          git push origin main
