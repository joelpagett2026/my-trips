name: Patch Concert Log icons v5 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-concert-icons-v5-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Increase Concert Log icons to 30px
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('concerts/index.html')
          page = path.read_text()
          old = 'width: 25px; height: 25px; background: currentColor; display: inline-block;'
          new = 'width: 30px; height: 30px; background: currentColor; display: inline-block;'
          if old in page:
              page = page.replace(old, new, 1)
          elif new not in page:
              raise SystemExit('Concert Log stat icon size CSS not found')
          path.write_text(page)
          Path('.github/workflows/patch-concert-icons-v5-once.yml').unlink()
          PY

      - name: Commit Concert Log icon sizing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts/index.html .github/workflows/patch-concert-icons-v5-once.yml
          git commit -m "Increase Concert Log icons to 30px"
          git pull --rebase origin main
          git push origin main
