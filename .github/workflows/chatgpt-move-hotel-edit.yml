name: ChatGPT move hotel edit button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  move-button:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move hotel edit button into section header
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('new-trip-v2.html')
          text = html.read_text()

          old_head = '''        <div class="rp2-section-head">\n          <div class="rp2-section-ico hotel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/></svg></div>\n          <span class="rp2-section-title">Hotel</span>\n        </div>'''
          new_head = '''        <div class="rp2-section-head">\n          <div class="rp2-section-ico hotel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h2v-9c0-2.21 1.79-4 4-4z"/></svg></div>\n          <span class="rp2-section-title">Hotel</span>\n          <button class="rp2-hotel-edit-chip rp2-hotel-edit-head" onclick="openHotelModal()">${icoEdit} Add / Edit</button>\n        </div>'''
          if old_head not in text:
              raise SystemExit('Hotel section header not found; no HTML change made.')
          text = text.replace(old_head, new_head, 1)

          old_photo_button = '        <button class="rp2-hotel-edit-chip" onclick="openHotelModal()">${icoEdit} Add / Edit</button>\n'
          if old_photo_button not in text:
              raise SystemExit('Existing hotel edit button not found; no HTML change made.')
          text = text.replace(old_photo_button, '', 1)
          html.write_text(text)

          css = Path('itinerary-v2-style.css')
          c = css.read_text()
          marker = '.rp2-hotel-edit-chip:hover { background: #fff; }\n'
          addition = marker + '''.rp2-hotel-edit-head {\n  position: static; margin-left: auto; flex-shrink: 0;\n  background: var(--surface); color: var(--teal);\n  border: 1px solid var(--line); box-shadow: none;\n  padding: 5px 9px;\n}\n.rp2-hotel-edit-head:hover { background: var(--teal-xdim); }\n'''
          if marker not in c:
              raise SystemExit('Hotel edit CSS marker not found; no CSS change made.')
          css.write_text(c.replace(marker, addition, 1))
          PY

      - name: Remove temporary workflow and commit
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-move-hotel-edit.yml
          git add new-trip-v2.html itinerary-v2-style.css
          git commit -m 'Move hotel edit button into section header'
          git push
