name: Validate and deploy joelpagett.co.uk

on:
  push:
    branches:
      - main
      - 'stability-hardening-*'
      - 'fix-mobile-modal-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate JavaScript syntax
        run: |
          node --check auth.js
          node --check db.js
          node --check itinerary-state-guard.js
          node --check itinerary-ui.js
          node --check trip-dashboard-create.js
          node --check trip-delete.js
          node --check activity-editor.js
          node --check settings-backup.js
          node --check datepicker.js
          node --check budget-live-redesign.js

      - name: Validate PHP syntax
        run: |
          php -l api.php
          php -l auth-v2.php
          php -l auth-session.php
          php -l record.php
          php -l record-delete.php
          php -l trip-create.php
          php -l trip-delete.php
          php -l place-photo.php
          php -l backup-export.php
          php -l home.php
          php -l settings.php
          php -l db-config.php
          php -l template-runtime.php
          php -l deploy-webhook.php
          php -l trip.php
          php -l share.php
          php -l trips.php
          php -l parks-map.php
          php -l scripts/validate-renderers.php

      - name: Validate web app manifest JSON
        run: python -m json.tool manifest.webmanifest >/dev/null

      - name: Validate source credential hygiene
        run: python scripts/validate-source-hygiene.py

      - name: Validate backup recovery readiness
        run: |
          python -m py_compile scripts/check-backup-recovery.py
          python scripts/check-backup-recovery.py --self-test

      - name: Validate runtime contracts
        run: python scripts/validate-runtime.py

      - name: Validate share privacy contracts
        run: python scripts/validate-share.py

      - name: Validate focused security contracts
        run: python scripts/validate-security.py

      - name: Validate response header contracts
        run: python scripts/validate-response-headers.py

      - name: Validate request body limit contracts
        run: python scripts/validate-request-limits.py

      - name: Validate reduced API surface
        run: python scripts/validate-api-surface.py

      - name: Validate deployment database guard
        run: python scripts/validate-deploy-data-guard.py

      - name: Validate stale save conflict latching
        run: python scripts/validate-save-conflicts.py

      - name: Validate authentication atomicity contracts
        run: python scripts/validate-auth-atomic.py

      - name: Validate backup consistency contracts
        run: python scripts/validate-backup.py

      - name: Validate atomic trip creation contracts
        run: python scripts/validate-trip-create.py

      - name: Validate atomic trip deletion contracts
        run: python scripts/validate-trip-delete.py

      - name: Test itinerary item deletion behavior
        run: node scripts/test-item-delete.js

      - name: Test itinerary item save transactions
        run: node scripts/test-item-save.js

      - name: Test activity editor controller
        run: node scripts/test-activity-editor.js

      - name: Test mobile modal overlay release
        run: node scripts/test-modal-overlay.js

      - name: Test fullscreen mobile activity modal
        run: node scripts/test-mobile-fullscreen-modal.js

      - name: Execute renderer integration contracts
        run: php scripts/validate-renderers.php

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook and verify production database
        run: |
          curl --fail --show-error --silent --retry 2 --retry-delay 3 \
            --header "X-Deploy-Key: ${{ secrets.DEPLOY_KEY }}" \
            --output /tmp/deploy.json \
            "https://joelpagett.co.uk/deploy-webhook.php"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/deploy.json').read_text())
          if payload.get('ok') is not True:
              raise SystemExit('deploy webhook did not report success')
          count = payload.get('registry_trip_count')
          if not isinstance(count, int) or count < 1:
              raise SystemExit('deploy webhook did not verify a non-empty production trip registry')
          failed = payload.get('failed')
          if failed:
              raise SystemExit('deploy webhook reported failed file copies')
          copied = payload.get('copied') or []
          if 'activity-editor.js' not in copied:
              raise SystemExit('deploy webhook did not copy activity-editor.js')
          print(f'deployed against verified database with {count} active itineraries')
          PY

      - name: Fetch live homepage response
        run: |
          curl --fail --show-error --silent \
            --dump-header /tmp/home.headers \
            "https://joelpagett.co.uk/" \
            --output /tmp/home.html

      - name: Verify raw homepage source canonicalizes
        run: |
          index_status=$(curl --show-error --silent \
            --output /tmp/index-redirect.html \
            --write-out "%{http_code}" \
            "https://joelpagett.co.uk/index.html")
          test "$index_status" = "302"

      - name: Verify PIN gate assets and established headers
        run: |
          grep -Eq 'src="/auth\.js\?v=[0-9]+"' /tmp/home.html
          grep -Eq 'src="/db\.js\?v=[0-9]+"' /tmp/home.html
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff[[:space:]]*$' /tmp/home.headers
          grep -Eiq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin[[:space:]]*$' /tmp/home.headers

      - name: Verify live frame protection header
        run: grep -Eiq '^x-frame-options:.*(SAMEORIGIN|DENY)' /tmp/home.headers

      - name: Verify live browser permissions header
        run: |
          grep -Eiq '^permissions-policy:.*camera[[:space:]]*=[[:space:]]*\(\)' /tmp/home.headers
          grep -Eiq '^permissions-policy:.*microphone[[:space:]]*=[[:space:]]*\(\)' /tmp/home.headers
          grep -Eiq '^permissions-policy:.*payment[[:space:]]*=[[:space:]]*\(\)' /tmp/home.headers
          grep -Eiq '^permissions-policy:.*usb[[:space:]]*=[[:space:]]*\(\)' /tmp/home.headers

      - name: Verify itinerary and dashboard runtime
        run: |
          curl --fail --show-error --silent \
            "https://joelpagett.co.uk/trips/" \
            --output /tmp/trips.html
          grep -Eq 'src="/auth\.js\?v=[0-9]+"' /tmp/trips.html
          grep -Eq 'src="/db\.js\?v=[0-9]+"' /tmp/trips.html
          grep -q 'Your saved trips have not been changed' /tmp/trips.html
          if grep -q 'try{ return await window.dbLoadRegistry(); }catch{ return \[\]; }' /tmp/trips.html; then
            echo 'live dashboard is still swallowing registry failures as an empty trip list'
            exit 1
          fi

          curl --fail --show-error --silent \
            "https://joelpagett.co.uk/porto-2026" \
            --output /tmp/trip.html
          grep -Eq 'src="/auth\.js\?v=[0-9]+"' /tmp/trip.html
          grep -Eq 'src="/db\.js\?v=[0-9]+"' /tmp/trip.html

      - name: Verify live cacheable itinerary core
        run: |
          python - <<'PY'
          import html
          import re
          from pathlib import Path
          page = Path('/tmp/trip.html').read_text()
          match = re.search(r'src="(/template-runtime\.php\?asset=itinerary-core(?:&amp;|&)v=[a-f0-9]{20})"', page)
          if not match:
              raise SystemExit('live owner itinerary did not reference the versioned external core')
          if "const AUTH_TOKEN = ''; // legacy constant intentionally disabled" in page:
              raise SystemExit('large itinerary core is still duplicated inline in owner HTML')
          Path('/tmp/itinerary-core.url').write_text(html.unescape(match.group(1)))
          PY
          core_url=$(cat /tmp/itinerary-core.url)
          curl --fail --show-error --silent \
            --dump-header /tmp/itinerary-core.headers \
            "https://joelpagett.co.uk${core_url}" \
            --output /tmp/itinerary-core.js
          grep -q "const AUTH_TOKEN = ''; // legacy constant intentionally disabled" /tmp/itinerary-core.js
          grep -q "'X-Auth-Token': (typeof getToken === 'function' ? getToken() : '')" /tmp/itinerary-core.js
          grep -q 'dayDate >= ci && dayDate < co' /tmp/itinerary-core.js
          grep -Eiq '^cache-control:.*max-age=31536000.*immutable' /tmp/itinerary-core.headers
          node --check /tmp/itinerary-core.js

      - name: Verify live activity editor controller
        run: |
          curl --fail --show-error --silent \
            "https://joelpagett.co.uk/trip-delete.js?verify-controller=4" \
            --output /tmp/trip-delete.js
          grep -q '__activityEditorControllerV4' /tmp/trip-delete.js
          grep -q "version: '4.0.0'" /tmp/trip-delete.js
          grep -q "overlay.style.removeProperty('pointer-events')" /tmp/trip-delete.js
          grep -q "overlay.style.removeProperty('z-index')" /tmp/trip-delete.js

      - name: Verify restored auth runtime
        run: |
          curl --fail --show-error --silent \
            "https://joelpagett.co.uk/auth.js?verify-restored-gate=1" \
            --output /tmp/auth.js
          grep -q 'Enter your PIN to continue' /tmp/auth.js
          if grep -q 'temporary_access' /tmp/auth.js; then
            echo 'temporary access code is still present in auth.js'
            exit 1
          fi

      - name: Verify server-only PHP helpers are blocked
        run: |
          for helper in db-config.php auth-session.php template-runtime.php secrets.php; do
            status=$(curl --show-error --silent \
              --output "/tmp/${helper}.blocked" \
              --write-out "%{http_code}" \
              "https://joelpagett.co.uk/${helper}")
            if [ "$status" != "403" ]; then
              echo "server-only helper ${helper} returned HTTP ${status}, expected 403"
              exit 1
            fi
          done
          echo 'server-only PHP helper paths: blocked'

      - name: Verify retired temporary access endpoint
        run: |
          temp_status=$(curl --show-error --silent \
            --output /tmp/temp-access.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://joelpagett.co.uk/auth-v2.php?action=temporary_access")
          test "$temp_status" = "404"

      - name: Verify protected record endpoint
        run: |
          record_status=$(curl --show-error --silent \
            --output /tmp/record-unauth.json \
            --write-out "%{http_code}" \
            "https://joelpagett.co.uk/record.php?action=load&id=trip-registry")
          test "$record_status" = "401"

      - name: Verify protected auth check endpoint
        run: |
          check_status=$(curl --show-error --silent \
            --output /tmp/check-unauth.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://joelpagett.co.uk/auth-v2.php?action=check")
          test "$check_status" = "401"

          echo 'PIN gate + response headers + dashboard session runtime + V4 activity editor + protected APIs: ok'
