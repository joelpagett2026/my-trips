name: One-time source credential cleanup

on:
  push:
    branches:
      - remove-committed-runtime-secrets

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: remove-committed-runtime-secrets
          fetch-depth: 0

      - name: Replace committed runtime literals with placeholders
        run: python scripts/apply-source-hygiene.py

      - name: Validate source hygiene
        run: python scripts/validate-source-hygiene.py

      - name: Validate PHP syntax
        run: php -l template-runtime.php

      - name: Validate renderer integration
        run: php scripts/validate-renderers.php

      - name: Remove one-time migration files and commit result
        run: |
          rm scripts/apply-source-hygiene.py .github/workflows/source-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 1
          fi
          git commit -m "Remove committed runtime credential literals"
          git push origin HEAD:remove-committed-runtime-secrets
