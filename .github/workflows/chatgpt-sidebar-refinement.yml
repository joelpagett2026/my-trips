name: Apply ChatGPT sidebar refinement

on:
  push:
    branches:
      - chatgpt/sidebar-redesign

permissions:
  contents: write

jobs:
  refine-sidebar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply sidebar design changes
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('itinerary-v2-style.css')
          text = css.read_text()
          marker = '/* CHATGPT SIDEBAR REFINEMENT */'
          if marker not in text:
              text += r'''

          /* CHATGPT SIDEBAR REFINEMENT */
          .rp-col {
            width: var(--rp-w);
            min-width: var(--rp-w);
            padding: 10px;
            gap: 10px;
            background: #f5f6f6;
            border-left: 1px solid var(--line);
          }
          .rp2-section {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
          }
          .rp2-section-head {
            padding: 11px 12px 9px;
            background: var(--surface);
          }
          .rp2-section-ico {
            width: 28px;
            height: 28px;
            border-radius: 8px;
          }
          .rp2-section-title { font-size: 10.5px; letter-spacing: .075em; }
          .rp2-section-viewall { font-size: 10.5px; }

          /* Hotel: make the image the visual anchor, with clean card details below. */
          .rp2-hotel-card {
            margin: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
          }
          .rp2-hotel-photo-wrap {
            height: 205px;
            border-radius: 0;
          }
          .rp2-detail-grid {
            border-top: 1px solid var(--line);
            background: var(--surface);
          }
          .rp2-detail-cell {
            min-height: 58px;
            padding: 9px 10px;
          }
          .rp2-detail-label { font-size: 8.5px; }
          .rp2-detail-val { font-size: 11px; line-height: 1.25; }

          /* Places to Eat: compact, consistent rows; never more than four. */
          .rp2-meal-row {
            min-height: 54px;
            padding: 8px 12px;
            border-top: 1px solid var(--line);
          }
          .rp2-meal-ico {
            width: 32px;
            height: 32px;
            border-radius: 9px;
          }
          .rp2-meal-name { font-size: 11.5px; font-weight: 700; }
          .rp2-meal-meta { margin-top: 2px; }
          .rp2-meal-row:nth-child(n+5) { display: none; }

          /* Trip Overview: clean white card that matches the rest of the dashboard. */
          .rp2-ov-bubble {
            margin: 0;
            background: var(--surface);
            border-radius: 0;
            box-shadow: none;
          }
          .rp2-overview-grid {
            border-top: 1px solid var(--line);
            border-left: 0;
            border-radius: 0;
          }
          .rp2-ov-cell {
            background: var(--surface);
            min-height: 88px;
          }
          .rp2-ov-count { color: var(--text); }
          .rp2-ov-label { color: var(--text3); }
          .rp2-ov-ico { color: var(--text); }
          .rp2-pill { background: rgba(14,122,135,.10); color: var(--teal); }
          .rp2-donut-row {
            margin: 0;
            padding: 12px 12px 13px;
            border-top: 1px solid var(--line);
            background: var(--surface);
          }
          .rp2-mini-donut { width: 48px; height: 48px; }
          .rp2-mini-donut svg { width: 48px; height: 48px; }
          .rp2-mini-donut-pct { color: var(--text); }
          .rp2-donut-title { color: var(--text); }
          .rp2-donut-sub { color: var(--text3); }

          @media (max-width: 1100px) {
            .rp-col { padding: 8px; gap: 8px; }
          }
          '''
              css.write_text(text)

          html = Path('new-trip-v2.html')
          h = html.read_text()
          old = 'const MAX_MEALS = 5;'
          new = 'const MAX_MEALS = 4;'
          if old not in h:
              raise SystemExit('MAX_MEALS target not found; no HTML change made.')
          html.write_text(h.replace(old, new, 1))
          PY

          sed -i 's/itinerary-v2-style.css?v=113/itinerary-v2-style.css?v=114/' new-trip-v2.html
          rm -f .github/workflows/chatgpt-sidebar-refinement.yml

      - name: Commit sidebar refinement
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-v2-style.css new-trip-v2.html .github/workflows/chatgpt-sidebar-refinement.yml
          git commit -m 'Refine itinerary sidebar layout and limit dining rows to four'
          git push
