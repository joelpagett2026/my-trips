name: Patch Concert Log guitar v7 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-concert-guitar-v7-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Cache-bust simplified Concerts guitar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('concerts/index.html')
          s = p.read_text()
          old = '/icons/concert-concerts.png?v=6'
          new = '/icons/concert-concerts.png?v=7'
          if old not in s:
              raise SystemExit('Expected v6 Concerts icon reference not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Commit simplified guitar reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts/index.html
          git commit -m "Use simplified guitar icon in Concert Log"
          git pull --rebase origin main
          git push origin main
