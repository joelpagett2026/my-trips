<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premium Hotels Booking Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0e7a87;--teal2:#0d9e8c;--teal-bg:rgba(14,122,135,.07);--teal-soft:rgba(14,122,135,.11);--surface:#fff;--text:#172329;--text2:#617278;--text3:#91a1a7;--line:rgba(0,0,0,.07);--shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06)}
*{box-sizing:border-box}body{margin:0;background:#e8e8e8;font-family:Montserrat,Arial,sans-serif;color:var(--text);padding:28px}.wrap{max-width:1040px;margin:0 auto}.panel{background:var(--teal-bg);border-radius:20px;padding:22px}.head{display:flex;align-items:center;gap:12px;color:var(--teal);font-size:20px;font-weight:800;margin-bottom:16px}.head-ico{width:42px;height:42px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center}.head-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.list{display:flex;flex-direction:column;gap:14px}.hotel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:20px;align-items:stretch}.photo{border-radius:14px;background-size:cover;background-position:center;min-height:134px}.main{min-width:0;display:flex;flex-direction:column}.name{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.2px;margin:3px 0 12px}.meta{display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--text2);font-size:12px;font-weight:500}.meta-item{display:flex;align-items:center;gap:7px}.meta-item svg{width:15px;height:15px;stroke:var(--teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.divider{height:1px;background:var(--line);margin:16px 0 13px}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(14,122,135,.12);background:#fff;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700;color:#35535a}.pill.confirmed{background:rgba(14,122,135,.08);border-color:transparent;color:var(--teal)}.pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.side{min-width:118px;border-left:1px solid var(--line);padding-left:18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:9px}.total-label{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}.price{font-size:27px;font-weight:800;color:var(--teal);line-height:1}.chev{width:36px;height:36px;border-radius:10px;background:#f3f5f5;display:grid;place-items:center;color:#52666d;font-size:22px;margin-top:5px}.note{font-size:11px;color:var(--text3);text-align:center;margin-top:14px}
@media(max-width:760px){body{padding:14px}.panel{padding:14px}.hotel{grid-template-columns:110px minmax(0,1fr);gap:14px}.photo{min-height:110px}.side{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:12px 0 0;flex-direction:row;align-items:center;justify-content:flex-end}.total-label{margin-right:auto}.price{font-size:22px}.name{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="head"><div class="head-ico"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg></div><span>Hotels <span style="font-size:12px;color:var(--text3);font-weight:600">(2)</span></span></div>
    <div class="list">
      <div class="hotel">
        <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=900&q=80')"></div>
        <div class="main">
          <div class="name">Fontinha Porto, Trademark Collection by Wyndham</div>
          <div class="meta">
            <div class="meta-item"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>29 Aug – 02 Sep 2026</span></div>
            <div class="meta-item"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/></svg><span>Ref: 90900EE04320</span></div>
          </div>
          <div class="divider"></div>
          <div class="pills">
            <span class="pill confirmed"><svg viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></svg>Confirmed</span>
            <span class="pill"><svg viewBox="0 0 24 24"><path d="M3 18v-7h18v7M5 11V7h6a3 3 0 0 1 3 3v1M3 18v3M21 18v3"/></svg>4 nights</span>
          </div>
        </div>
        <div class="side"><div class="total-label">Total</div><div class="price">£310</div><div class="chev">›</div></div>
      </div>
      <div class="hotel">
        <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=900&q=80')"></div>
        <div class="main">
          <div class="name">INNSiDE Braga Centro</div>
          <div class="meta">
            <div class="meta-item"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>02 – 04 Sep 2026</span></div>
            <div class="meta-item"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/></svg><span>Ref: 2604719183</span></div>
          </div>
          <div class="divider"></div>
          <div class="pills">
            <span class="pill confirmed"><svg viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></svg>Confirmed</span>
            <span class="pill"><svg viewBox="0 0 24 24"><path d="M3 18v-7h18v7M5 11V7h6a3 3 0 0 1 3 3v1M3 18v3M21 18v3"/></svg>2 nights</span>
            <span class="pill"><svg viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M15 3v18M15 3c3 0 5 3 5 7h-5"/></svg>Breakfast incl.</span>
          </div>
        </div>
        <div class="side"><div class="total-label">Total</div><div class="price">£208</div><div class="chev">›</div></div>
      </div>
    </div>
  </div>
  <div class="note">Test branch preview only — main is untouched.</div>
</div>
</body>
</html>
