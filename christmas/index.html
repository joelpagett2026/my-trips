<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#A72336">
<title>Christmas Present Tracker · Joel Pagett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/christmas/style.css?v=9">
<script src="/auth.js?v=4"></script><script src="/db.js?v=fitness1"></script>
<script defer src="/christmas/app.js?v=8"></script>
</head><body>
<div id="app">
  <nav class="planner-nav" aria-label="Christmas Present Tracker">
    <a href="/" class="planner-home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>Home</span></a>
    <h1 class="planner-title">Christmas Present Tracker</h1>
    <button class="planner-add" type="button" data-action="add-gift" aria-label="Add a gift">+ Gift</button>
  </nav>
  <main class="shell">
    <header class="page-header">
      <div class="planner-toolbar">
        <label class="year-picker"><span>Christmas</span><select id="year-select" aria-label="Christmas year"><option>2026</option></select></label>
        <span id="save-status" role="status" aria-live="polite">Connecting…</span>
      </div>
      <div class="progress-row">
        <div class="progress-copy"><strong id="total-progress">0 of 0 completed</strong><span id="total-left">Add your first gift</span></div>
        <div class="progress-track" role="progressbar" aria-label="Presents bought or delivered" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="total-track"><span id="total-bar" class="progress-complete" style="width:0%"></span><span id="total-ordered-bar" class="progress-ordered" style="width:0%"></span></div>
      </div>
      <div class="spending-summary" aria-label="Christmas budget summary">
        <div class="legend" aria-label="Gift statuses"><span><i class="dot blank"></i> Not bought</span><span><i class="dot ordered"></i> Ordered</span><span><i class="dot delivered"></i> Bought / delivered</span></div>
        <div class="spending-values"><span>Spent <output id="total-spent">£0.00</output></span><span>Still to buy <output id="total-planned">£0.00</output></span></div>
      </div>
    </header>
    <div id="error" role="alert" class="alert" hidden></div>
    <div id="recovery" role="alert" class="alert" hidden></div>
    <section id="group-grid" class="group-grid" aria-label="Christmas present family groups"><div class="loading">Loading family list…</div></section>
    <footer class="footer"><span>Tap a gift’s status to cycle: not bought, ordered, bought / delivered.<br>Spent includes ordered and delivered gifts.</span><button type="button" class="quiet" data-action="new-year">＋ Start next Christmas</button></footer>
  </main>
</div>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-inner"><div class="dialog-head"><h2 id="editor-title">Add present</h2><button type="button" id="close-editor" class="close" aria-label="Close">✕</button></div><form id="editor-form"></form></div></dialog>
<div id="toast" hidden role="status" aria-live="polite"></div>
</body></html>
