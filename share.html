<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Itinerary</title>
<link rel="icon" href="/icons/trips-favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/db.js" defer></script>
<style>
:root {
  --teal:       #0e7a87;
  --teal-dim:   rgba(14,122,135,0.14);
  --teal-xdim:  rgba(14,122,135,0.06);
  --bg:         #e8e8e8;
  --surface:    #ffffff;
  --text:       #1a2428;
  --text2:      #5a6a70;
  --text3:      #9aacb0;
  --line:       rgba(0,0,0,0.08);
  --transport:  #526B82;
  --transport-bg: rgba(82,107,130,0.10);
  --activity:   #5A8968;
  --activity-bg: rgba(90,137,104,0.10);
  --amber:      #b96a00;
  --amber-bg:   rgba(185,106,0,0.10);
  --shadow:     0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.05);
  --r:14px; --r-sm:9px;
  --font:'Montserrat',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh;}

.sh-banner{background:linear-gradient(135deg,var(--teal),#0d9e8c);color:#fff;padding:8px 20px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:0.02em;}
.sh-wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px;}

.sh-head{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;}
.sh-photo{width:100%;height:180px;object-fit:cover;display:block;background:#ccc;}
.sh-head-body{padding:16px 20px;}
.sh-dest{font-size:22px;font-weight:800;letter-spacing:-0.01em;}
.sh-meta{font-size:12px;color:var(--text2);margin-top:4px;}

.sh-daytabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.sh-daytab{flex-shrink:0;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-size:11px;font-weight:700;color:var(--text2);cursor:pointer;text-align:center;font-family:var(--font);}
.sh-daytab .sh-daytab-num{display:block;font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);font-weight:700;margin-bottom:2px;}
.sh-daytab.active{background:var(--teal-dim);border-color:var(--teal);color:var(--teal);}
.sh-daytab.active .sh-daytab-num{color:var(--teal);opacity:0.75;}

.sh-section-title{font-size:11px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px;}
.sh-day-loc{font-size:11px;color:var(--text2);margin-bottom:12px;}

.sh-item{background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;margin-bottom:8px;align-items:flex-start;}
.sh-item-time{width:48px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--text2);padding-top:1px;}
.sh-item-ico{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--teal-xdim);color:var(--teal);}
.sh-item-ico.move{background:var(--transport-bg);color:var(--transport);}
.sh-item-ico.act,.sh-item-ico.attraction{background:var(--activity-bg);color:var(--activity);}
.sh-item-ico.meal{background:var(--amber-bg);color:var(--amber);}
.sh-item-ico svg{width:14px;height:14px;}
.sh-item-body{flex:1;min-width:0;}
.sh-item-kicker{font-size:9px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);margin-bottom:2px;}
.sh-item-title{font-size:13px;font-weight:700;color:var(--text);}
.sh-item-sub{font-size:11.5px;color:var(--text2);margin-top:2px;}
.sh-item-booking{font-size:10.5px;color:var(--text3);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;}
.sh-item-booking span{background:var(--bg);border-radius:5px;padding:2px 7px;}

.sh-hotel-card{background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;}
.sh-hotel-photo{width:100%;height:120px;object-fit:cover;display:block;}
.sh-hotel-body{padding:12px 14px;}
.sh-hotel-name{font-size:13px;font-weight:700;}
.sh-hotel-meta{font-size:11px;color:var(--text2);margin-top:3px;}

.sh-empty{background:var(--surface);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:16px;text-align:center;color:var(--text3);font-size:11.5px;}

.sh-state{max-width:420px;margin:80px auto;text-align:center;padding:0 20px;}
.sh-state-title{font-size:17px;font-weight:800;margin-bottom:6px;}
.sh-state-sub{font-size:12.5px;color:var(--text2);}
</style>
</head>
<body>

<div class="sh-banner">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
  Read-only shared itinerary
</div>

<div class="sh-wrap" id="sh-wrap">
  <div class="sh-state" id="sh-loading">
    <div class="sh-state-title">Loading itinerary…</div>
  </div>
</div>

<script>
let SHARE_DATA = null;
let activeDay = 0;

function parseDMY(str) {
  const m = (str || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}

const ICONS = {
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9 0-1.2.3l-.9.9c-.5.5-.4 1.2.2 1.5l5.7 3.2-2 2.7-2.4-.2c-.4 0-.7.1-1 .4l-.6.5c-.4.4-.4 1 0 1.4l2.5 2.5 2.5 2.5c.4.4 1 .4 1.4 0l.5-.6c.3-.3.4-.6.4-1l-.2-2.4 2.7-2 3.2 5.7c.3.6 1 .7 1.5.2l.9-.9c.3-.3.4-.7.3-1.2z"/></svg>',
  meal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4Z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>',
  act: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  attraction: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
};

function itemIcon(type) {
  return ICONS[type] || ICONS.act;
}

async function init() {
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  const wrap = document.getElementById('sh-wrap');

  if (!token) {
    wrap.innerHTML = stateHtml('Link missing', 'This share link is incomplete — check you copied the whole URL.');
    return;
  }

  try {
    const result = await dbLoadShare(token);
    if (!result || !result.data) {
      wrap.innerHTML = stateHtml('Link not found', 'This share link may have been revoked or is no longer valid.');
      return;
    }
    SHARE_DATA = result.data;
    if (!SHARE_DATA.days || !SHARE_DATA.days.length) {
      wrap.innerHTML = stateHtml('Nothing to show yet', 'This itinerary doesn\'t have any days added yet.');
      return;
    }
    // Jump to today's day if it's within the trip, else Day 1
    const now = new Date();
    const today = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
    const todayIdx = SHARE_DATA.days.findIndex(d => d.date === today);
    activeDay = todayIdx !== -1 ? todayIdx : 0;
    render();
  } catch (e) {
    wrap.innerHTML = stateHtml('This link is no longer valid', 'It may have been revoked by the trip owner.');
  }
}

function stateHtml(title, sub) {
  return `<div class="sh-state"><div class="sh-state-title">${title}</div><div class="sh-state-sub">${sub}</div></div>`;
}

function render() {
  const wrap = document.getElementById('sh-wrap');
  const m = SHARE_DATA.meta || {};
  const days = SHARE_DATA.days;
  const day = days[activeDay];

  const dateRange = [m.dep, m.ret].filter(Boolean).join(' – ');
  const travLabel = m.trav ? `${m.trav} traveller${m.trav == 1 ? '' : 's'}` : '';

  let html = `<div class="sh-head">`;
  if (m.coverPhoto) html += `<img class="sh-photo" src="${m.coverPhoto}" alt="${m.dest || ''}">`;
  html += `<div class="sh-head-body">
    <div class="sh-dest">${m.dest || 'Trip'}</div>
    <div class="sh-meta">${[dateRange, travLabel].filter(Boolean).join(' · ')}</div>
  </div></div>`;

  html += `<div class="sh-daytabs">`;
  days.forEach((d, i) => {
    html += `<button class="sh-daytab ${i === activeDay ? 'active' : ''}" onclick="activeDay=${i};render();">
      <span class="sh-daytab-num">Day ${i+1}</span>${(d.date || '').slice(0,5)}
    </button>`;
  });
  html += `</div>`;

  // Hotel covering this day
  const hotels = m.hotels || (m.hotel ? [m.hotel] : []);
  const dayDate = parseDMY(day.date);
  const hotel = hotels.find(h => {
    const ci = parseDMY(h.checkin), co = parseDMY(h.checkout);
    return ci && co && dayDate && dayDate >= ci && dayDate <= co;
  });
  if (hotel) {
    html += `<div class="sh-section-title">Hotel</div><div class="sh-hotel-card">`;
    if (hotel.photo) html += `<img class="sh-hotel-photo" src="${hotel.photo}" alt="${hotel.name || ''}">`;
    html += `<div class="sh-hotel-body">
      <div class="sh-hotel-name">${hotel.name || ''}</div>
      <div class="sh-hotel-meta">${[hotel.checkin, hotel.checkout].filter(Boolean).join(' – ')}${hotel.nightly ? ' · ' + hotel.nightly + '/night' : ''}</div>`;
    if (hotel.ref) html += `<div class="sh-item-booking"><span>Ref: ${hotel.ref}</span></div>`;
    html += `</div></div>`;
  }

  html += `<div class="sh-section-title">${day.title || `Day ${activeDay+1}`}</div>`;
  if (day.loc) html += `<div class="sh-day-loc">${day.loc}</div>`;

  const items = day.items || [];
  if (!items.length) {
    html += `<div class="sh-empty">Nothing planned for this day yet.</div>`;
  } else {
    items.forEach(item => {
      const type = item.type || 'act';
      html += `<div class="sh-item">
        <div class="sh-item-time">${item.time || ''}</div>
        <div class="sh-item-ico ${type}">${itemIcon(type)}</div>
        <div class="sh-item-body">
          ${item.kicker ? `<div class="sh-item-kicker">${item.kicker}</div>` : ''}
          <div class="sh-item-title">${item.title || ''}</div>
          ${item.sub ? `<div class="sh-item-sub">${item.sub}</div>` : ''}
          ${bookingHtml(item.booking)}
        </div>
      </div>`;
    });
  }

  wrap.innerHTML = html;
}

function bookingHtml(booking) {
  if (!booking) return '';
  const parts = [];
  if (booking.ref) parts.push(`<span>Ref: ${booking.ref}</span>`);
  if (booking.price) parts.push(`<span>${booking.price}</span>`);
  if (!parts.length) return '';
  return `<div class="sh-item-booking">${parts.join('')}</div>`;
}

// Wait for db.js (deferred) to be ready before calling dbLoadShare
if (typeof dbLoadShare === 'function') { init(); }
else { window.addEventListener('DOMContentLoaded', init); }
</script>
</body>
</html>
