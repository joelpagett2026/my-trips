<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget · Trip</title>
<link rel="icon" href="/icons/trips-favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/itinerary-v2-style.css?v=40">
<link rel="stylesheet" href="/budget-style.css?v=1">
<script src="/auth.js" defer></script>
<script src="/db.js" defer></script>
</head>
<body>

<!-- SIDEBAR (same as v2) -->
<aside class="v2-sidebar">
  <div class="sb-trip">
    <div class="sb-flag" id="sb-flag">🌍</div>
    <div class="sb-name" id="sb-name">Loading…</div>
    <div class="sb-meta" id="sb-meta"></div>
  </div>
  <nav class="sb-nav">
    <button class="sb-btn" onclick="location.href=TRIP_URL">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Itinerary
    </button>
    <button class="sb-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Budget
    </button>
  </nav>
  <div class="sb-bottom">
    <button class="sb-btn" onclick="location.href='/trips/'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      All trips
    </button>
  </div>
</aside>

<!-- MAIN -->
<div class="budget-page">
  <div class="v2-topbar">
    <div class="tb-left">
      <div class="tb-kicker" id="tb-kicker">Budget</div>
      <div class="tb-title" id="tb-title">Loading…</div>
    </div>
    <div class="tb-right">
      <span class="tb-status" id="tb-status"></span>
      <button class="tb-btn" onclick="location.href=TRIP_URL">← Itinerary</button>
    </div>
  </div>

  <div class="budget-main" id="budget-main">
    <div style="color:var(--text3);text-align:center;padding:40px 0;font-size:13px;">Loading budget…</div>
  </div>
</div>

<script>
// Read URL params
const params = new URLSearchParams(window.location.search);
const dest   = params.get('dest') || 'New Trip';
const dep    = params.get('dep')  || '';
const ret    = params.get('ret')  || '';
const trav   = params.get('trav') || '2';
const status = params.get('status') || 'upcoming';
const slug   = params.get('slug') || 'new-trip';

// Use slug as the database record ID
const RECORD_ID = slug;
// Budget-specific derived values (computed after bake)
const _trav = parseInt(trav) || 2;
const TRIP_URL = '/' + slug + '-v2.html';

const AUTH_TOKEN = '06843e3f58776ec2eb5e0cc7a44a3c3fc1b4b9af2e75504da3d299dc566cc395';

// ── PRICE PARSING ──────────────────────────────────────────────────
function parsePrice(str, numTrav) {
  if (!str) return null;
  const s = String(str).replace(/,/g,'');
  const pp = /pp/i.test(s);
  const m  = s.match(/[\d.]+/);
  if (!m) return null;
  const v = parseFloat(m[0]);
  return pp ? v * numTrav : v;
}

function fmt(n) {
  if (n === null || n === undefined) return null;
  return '£' + n.toFixed(2).replace(/\.00$/, '');
}

// ── ICONS ──────────────────────────────────────────────────────────
const IC = {
  hotel:`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  plane:`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>`,
  train:`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><line x1="8" y1="19" x2="16" y2="19"/><path d="M8 19l-2 2"/><path d="M16 19l2 2"/></svg>`,
  bus:`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6v6"/><path d="M16 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>`,
  ticket:`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/></svg>`,
  pin:`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  avios:`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
};

function rowIco(type, kicker) {
  if (type==='hotel') return IC.hotel;
  if (kicker==='Flight') return IC.plane;
  if (kicker==='Train') return IC.train;
  if (kicker==='Bus'||kicker==='Coach') return IC.bus;
  if (type==='ticket') return IC.ticket;
  return IC.pin;
}

// ── EXTRACT BUDGET DATA FROM STATE ─────────────────────────────────
function extractBudget(state) {
  const numTrav = _trav;
  const hotels     = [];
  const flights    = [];
  const transport  = [];
  const attractions= [];

  // Hotels
  for (const h of (state.meta?.hotels || [])) {
    const nights   = h.nights || (() => {
      const d1=parseDate(h.checkin), d2=parseDate(h.checkout);
      return (d1&&d2) ? Math.round((d2-d1)/86400000) : null;
    })();
    const nightly  = parsePrice(h.nightly, 1); // per room, not pp
    const total    = (nightly && nights) ? nightly * nights : null;
    hotels.push({ name:h.name, checkin:h.checkin, checkout:h.checkout, nights, nightly, total, ref:h.ref, breakfast:h.breakfast });
  }

  // Items
  for (const d of (state.days || [])) {
    for (const it of (d.items || [])) {
      if (!it) continue;
      const b = it.booking || {};
      const price = parsePrice(b.price, numTrav);
      const rawPrice = b.price || null;
      if (it.type === 'move') {
        const kicker = it.kicker || (it.transport?.mode) || 'Transport';
        const obj = { title:it.title, kicker, price, rawPrice, date:d.date, ref:b.ref, avios:it._avios||null };
        kicker === 'Flight' ? flights.push(obj) : (price ? transport.push(obj) : null);
      } else if ((it.type==='act'||it.type==='ticket') && price) {
        attractions.push({ title:it.title, price, rawPrice, date:d.date, ref:b.ref, tickets:b.tickets, url:b.url });
      }
    }
  }

  return { hotels, flights, transport, attractions, numTrav };
}

function parseDate(str) {
  if (!str) return null;
  const [d,m,y] = (str||'').split('/').map(Number);
  return new Date(y,m-1,d);
}

// ── DONUT CHART ─────────────────────────────────────────────────────
function donutSVG(segments) {
  // segments: [{value, color}], draws as conic arcs
  const r=48, cx=60, cy=60, circumference=2*Math.PI*r;
  let offset=0, paths='';
  const total=segments.reduce((s,x)=>s+x.value,0);
  if(!total) return '<circle cx="60" cy="60" r="48" fill="none" stroke="#eee" stroke-width="14"/>';
  for(const seg of segments){
    const dash=(seg.value/total)*circumference;
    paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="14" stroke-dasharray="${dash.toFixed(2)} ${(circumference-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" />`;
    offset+=dash;
  }
  return paths;
}

// ── RENDER ──────────────────────────────────────────────────────────
let STATE;
let AVIOS_CHANGES = {};

async function loadAndRender() {
  try {
    const saved = await dbLoad(RECORD_ID);
    STATE = saved?.data || saved;
    if (!STATE?.days) { document.getElementById('budget-main').innerHTML = '<div class="bp-empty">No itinerary data found. <a href="' + TRIP_URL + '">Go to itinerary →</a></div>'; return; }
  } catch(e) {
    document.getElementById('budget-main').innerHTML = '<div class="bp-empty">Could not load trip data.</div>'; return;
  }

  // Update sidebar
  const flag = {'Porto':'🇵🇹','Hamburg':'🇩🇪','Cyprus':'🇨🇾','China':'🇨🇳','Dubai':'🇦🇪','Costa Rica':'🇨🇷','Canada':'🇨🇦'}[dest] || '🌍';
  document.getElementById('sb-flag').textContent = flag;
  document.getElementById('sb-name').textContent = dest;
  document.getElementById('sb-meta').textContent = (dep&&ret ? dep+' → '+ret+'\n' : '') + trav + ' traveller' + (_trav!==1?'s':'');
  document.getElementById('tb-title').textContent = dest + ' · Budget';
  document.getElementById('tb-kicker').textContent = dep && ret ? dep + ' – ' + ret : 'Budget';

  renderBudget();
}

function renderBudget() {
  const { hotels, flights, transport, attractions, numTrav } = extractBudget(STATE);

  // Totals
  const hotelTotal  = hotels.reduce((s,h)=>s+(h.total||0), 0);
  const flightTotal = flights.reduce((s,f)=>s+(f.price||0), 0);
  const transTotal  = transport.reduce((s,t)=>s+(t.price||0), 0);
  const actTotal    = attractions.reduce((s,a)=>s+(a.price||0), 0);
  const grand       = hotelTotal + flightTotal + transTotal + actTotal;
  const totalAvios  = flights.reduce((s,f)=>s+(parseInt(f.avios)||0),0);
  const perPerson   = numTrav > 1 ? grand / numTrav : null;

  const cats = [
    { key:'hotel',      label:'Hotel',      val:hotelTotal,  color:'#0e7a87' },
    { key:'flight',     label:'Flights',    val:flightTotal, color:'#6366f1' },
    { key:'transport',  label:'Transport',  val:transTotal,  color:'#d97b0a' },
    { key:'attraction', label:'Activities', val:actTotal,    color:'#1a8a52' },
  ];

  const main = document.getElementById('budget-main');
  main.innerHTML = '';

  // ── TRIP TOTAL PANEL ──
  const totalPanel = document.createElement('div');
  totalPanel.className = 'budget-total-panel';
  totalPanel.style.marginBottom = '20px';

  const donutSegs = cats.filter(c=>c.val>0).map(c=>({value:c.val, color:c.color}));

  totalPanel.innerHTML = `
    <div class="btp-head">
      <div>
        <div class="btp-head-title">Total trip cost</div>
        <div class="btp-grand">${fmt(grand)}</div>
      </div>
      <div class="btp-donut">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">${donutSVG(donutSegs)}</svg>
        <div class="btp-donut-center">
          <div class="btp-donut-pct">${numTrav} ppl</div>
        </div>
      </div>
    </div>
    <div class="btp-body">
      <div class="btp-cats">
        ${cats.map(c => {
          const pct = grand ? Math.round((c.val/grand)*100) : 0;
          return `<div class="btp-cat-row">
            <div class="btp-cat-name">${c.label}</div>
            <div class="btp-cat-bar-wrap"><div class="btp-cat-bar ${c.key}" style="width:${pct}%"></div></div>
            <div class="btp-cat-val">${c.val ? fmt(c.val) : '—'}</div>
            <div class="btp-cat-pct">${pct ? pct+'%' : ''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="btp-summary">
      <div class="btp-sum-item">
        <div class="btp-sum-label">Grand total</div>
        <div class="btp-sum-val">${fmt(grand)}</div>
      </div>
      ${perPerson ? `<div class="btp-sum-item">
        <div class="btp-sum-label">Per person</div>
        <div class="btp-sum-val">${fmt(perPerson)}</div>
      </div>` : ''}
      ${totalAvios ? `<div class="btp-sum-item">
        <div class="btp-sum-label">Total Avios</div>
        <div class="btp-sum-val avios">${totalAvios.toLocaleString()}</div>
      </div>` : ''}
      <div class="btp-sum-item">
        <div class="btp-sum-label">Travellers</div>
        <div class="btp-sum-val">${numTrav}</div>
      </div>
    </div>`;
  main.appendChild(totalPanel);

  // ── 2×2 GRID ──
  const grid = document.createElement('div');
  grid.className = 'budget-grid';
  main.appendChild(grid);

  // Helper to build a panel
  function panel(cls, icoClass, title, totalVal, bodyHtml, footHtml) {
    return `<div class="budget-panel">
      <div class="bp-head">
        <div class="bp-ico ${icoClass}">${IC[icoClass==='hotel'?'hotel':icoClass==='flight'?'plane':icoClass==='transport'?'bus':'ticket']}</div>
        <div class="bp-title">${title}</div>
        ${totalVal !== null ? `<div class="bp-total-badge">${fmt(totalVal)}</div>` : ''}
      </div>
      <div class="bp-body">${bodyHtml || '<div class="bp-empty">None logged</div>'}</div>
      ${footHtml ? `<div class="bp-foot">${footHtml}</div>` : ''}
    </div>`;
  }

  // ── HOTELS ──
  const hotelRows = hotels.map(h => {
    const bfTag = h.breakfast==='included'
      ? '<span style="font-size:9.5px;color:var(--green);font-weight:700;margin-left:6px;">Breakfast incl.</span>' : '';
    return `<div class="bp-row">
      <div class="bp-row-ico">${IC.hotel}</div>
      <div class="bp-row-info">
        <div class="bp-row-name">${h.name || '—'} ${bfTag}</div>
        <div class="bp-row-meta">${h.checkin||''} → ${h.checkout||''} · ${h.nights||'?'} nights</div>
        ${h.ref ? `<div class="bp-row-meta" style="font-variant-numeric:tabular-nums">Ref: ${h.ref}</div>` : ''}
      </div>
      <div class="bp-row-right">
        <div class="bp-row-cost">${h.total ? fmt(h.total) : '—'}</div>
        ${h.nightly ? `<div style="font-size:10px;color:var(--text3);margin-top:2px;">${fmt(h.nightly)}/night</div>` : ''}
      </div>
    </div>`;
  }).join('');
  const hotelFoot = `
    <div class="bp-foot-row"><span class="bp-foot-label">Total stay</span><span class="bp-foot-val teal">${fmt(hotelTotal)}</span></div>
    ${hotels.length > 1 ? `<div class="bp-foot-row"><span class="bp-foot-label">${hotels.length} hotels</span><span class="bp-foot-val avg">${fmt(hotelTotal/hotels.length)} avg</span></div>` : ''}`;

  // ── FLIGHTS ──
  const flightRows = flights.map((f,i) => `<div class="bp-row" id="flight-row-${i}">
    <div class="bp-row-ico">${IC.plane}</div>
    <div class="bp-row-info">
      <div class="bp-row-name">${f.title}</div>
      <div class="bp-row-meta">${f.date||''} ${f.ref ? '· Ref: '+f.ref : ''}</div>
      <div class="bp-row-avios">
        ${IC.avios.replace('<svg','<svg width="10" height="10" style="margin-right:3px;vertical-align:-1px"')}
        <input class="avios-input" data-flight="${i}" placeholder="+ Add Avios" value="${f.avios||''}" onchange="saveAvios(${i},this.value)" onblur="saveAvios(${i},this.value)">
      </div>
    </div>
    <div class="bp-row-right">
      <div class="bp-row-cost">${f.price ? fmt(f.price) : '—'}</div>
      ${f.rawPrice ? `<div style="font-size:10px;color:var(--text3);margin-top:2px;">${f.rawPrice}</div>` : ''}
    </div>
  </div>`).join('');
  const flightFoot = `
    <div class="bp-foot-row"><span class="bp-foot-label">Total flights</span><span class="bp-foot-val teal">${fmt(flightTotal)}</span></div>
    ${flightTotal && numTrav>1 ? `<div class="bp-foot-row"><span class="bp-foot-label">Per person</span><span class="bp-foot-val avg">${fmt(flightTotal/numTrav)}</span></div>` : ''}
    ${totalAvios ? `<div class="bp-foot-row"><span class="bp-foot-label">Total Avios</span><span class="bp-foot-val avios">${totalAvios.toLocaleString()}</span></div>` : ''}`;

  // ── TRANSPORT ──
  const transRows = transport.map(t => `<div class="bp-row">
    <div class="bp-row-ico">${rowIco('move', t.kicker)}</div>
    <div class="bp-row-info">
      <div class="bp-row-name">${t.title}</div>
      <div class="bp-row-meta">${t.kicker||''} ${t.date ? '· '+t.date : ''}</div>
    </div>
    <div class="bp-row-right">
      <div class="bp-row-cost">${t.price ? fmt(t.price) : '—'}</div>
      ${t.rawPrice ? `<div style="font-size:10px;color:var(--text3);margin-top:2px;">${t.rawPrice}</div>` : ''}
    </div>
  </div>`).join('');
  const transFoot = `<div class="bp-foot-row"><span class="bp-foot-label">Total transport</span><span class="bp-foot-val teal">${fmt(transTotal)}</span></div>`;

  // ── ATTRACTIONS ──
  const actRows = attractions.map(a => `<div class="bp-row">
    <div class="bp-row-ico">${IC.ticket}</div>
    <div class="bp-row-info">
      <div class="bp-row-name">${a.title}</div>
      <div class="bp-row-meta">${a.date||''} ${a.tickets ? '· '+a.tickets : ''}</div>
      ${a.url ? `<a href="${a.url}" target="_blank" class="bp-row-link">Open booking →</a>` : ''}
    </div>
    <div class="bp-row-right">
      <div class="bp-row-cost">${a.price ? fmt(a.price) : '—'}</div>
      ${a.rawPrice ? `<div style="font-size:10px;color:var(--text3);margin-top:2px;">${a.rawPrice}</div>` : ''}
    </div>
  </div>`).join('');
  const actFoot = `
    <div class="bp-foot-row"><span class="bp-foot-label">Total activities</span><span class="bp-foot-val teal">${fmt(actTotal)}</span></div>
    ${actTotal && numTrav>1 ? `<div class="bp-foot-row"><span class="bp-foot-label">Per person</span><span class="bp-foot-val avg">${fmt(actTotal/numTrav)}</span></div>` : ''}`;

  grid.innerHTML =
    panel('hotel', 'hotel', 'Accommodation', hotelTotal, hotelRows, hotelFoot) +
    panel('flight', 'flight', 'Flights', flightTotal, flightRows, flightFoot) +
    panel('transport', 'transport', 'Transport', transTotal || null, transRows, transRows ? transFoot : '') +
    panel('attraction', 'attraction', 'Activities & Attractions', actTotal, actRows, actFoot);
}

// ── AVIOS ────────────────────────────────────────────────────────────
async function saveAvios(flightIdx, value) {
  const num = parseInt(value) || null;
  // Find the flight item in STATE and update _avios
  let fi = 0;
  for (const d of STATE.days || []) {
    for (const it of d.items || []) {
      if (!it || it.type !== 'move' || (it.kicker||it.transport?.mode) !== 'Flight') continue;
      if (fi === flightIdx) { it._avios = num; break; }
      fi++;
    }
  }
  try {
    await dbSave(RECORD_ID, STATE);
    // Re-render just the totals section without full page reload
    renderBudget();
  } catch(e) { console.error('Save failed', e); }
}

// ── INIT ─────────────────────────────────────────────────────────────
window.addEventListener('load', () => { loadAndRender(); });
</script>
</body>
</html>
